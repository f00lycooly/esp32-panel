# ─────────────────────────────────────────────────────────────────────────────
# page-vacuum.yaml — robot-vacuum status + control page.
# Kitchen-only. Status-forward: a colour-coded STATE HERO, an LVGL progress bar
# (cleaning only), a fault/OK banner, ONE context-aware split-primary control,
# three content "session" pills, and a 2-pill bottom shell_bar. A top_layer
# "Choose a clean" modal launches saved Roborock routines.
#
# Design (locked 2026-06-29, frontend-design + visual companion):
#   • Top bar      : global top_layer chrome (HOME/battery), untouched.
#   • Hero         : robot glyph + STATE word, Portal-coloured (rest=ep_blue,
#                    active=ep_orange, error=red, idle=grey).
#   • Progress     : LVGL bar + "% cleaned" — shown only while cleaning/returning.
#   • Banner       : blue "All systems nominal" OR red fault (roborock fault
#                    sensors: vacuum_error / dock_dock_error / water_shortage /
#                    dirty+clean tank / mop+water-box detached).
#   • Primary      : context split button driven by vac_render —
#                      docked/idle  → START · <default routine>  + MORE (picker)
#                      cleaning      → DOCK (return_to_base)      + PAUSE
#                      paused        → RESUME (vacuum.start)      + DOCK
#   • Content pills: swap by state —
#                      cleaning  → Room · Duration · Progress
#                      docked    → Last clean · Status · Total cleans
#   • Bottom bar   : 2 wide status pills — Battery(hoover) · Status. (The hoover
#                    battery lives HERE, not the top bar — that's the home battery.)
#
# All UI state is rendered by ONE script (vac_render) reading the HA sensors
# below; every sensor on_value just re-invokes it (single source of truth).
# nav coords sit F1·P1 on Kitchen (same function row as Room, page 1).
# ─────────────────────────────────────────────────────────────────────────────
# Display-capture self-registration: this page owns its
# screenshot endpoint. Inert unless the device includes
# modules/display-capture.yaml (capture_mode "on"). See modules/capture/.
packages:
  capture_vacuum: !include capture/${capture_mode}/vacuum.yaml

substitutions:
  vacuum_nav_f: "1"      # example: same function row as Room, page index 1
  vacuum_nav_p: "1"
# NOTE: the per-panel vacuum bindings consumed below (vacuum_*_entity,
# routine_default_*, clean_row_N_*) are defined in user-config.yaml
# (see user-config.yaml.example, Vacuum section) — this module carries no
# site defaults. Error/tank sources assume a Roborock-style entity set;
# rebind to whatever your vacuum integration exposes.

# ── Page-local MDI glyphs (every $mdi_* this file uses is declared here) ──
font:
  - file: 'assets/fonts/materialdesignicons-webfont.ttf'
    id: mdi_vac_64
    size: 64
    bpp: 4
    glyphs: [$mdi_robot_vacuum]
  - file: 'assets/fonts/materialdesignicons-webfont.ttf'
    id: mdi_vac_46
    size: 46
    bpp: 4
    glyphs: [$mdi_play, $mdi_pause, $mdi_home_import_outline, $mdi_dots_horizontal]
  - file: 'assets/fonts/materialdesignicons-webfont.ttf'
    id: mdi_vac_36
    size: 36
    bpp: 4
    glyphs: [$mdi_shield_check, $mdi_alert_octagon, $mdi_robot_vacuum, $mdi_close,
             $mdi_home_floor_g, $mdi_vacuum, $mdi_vacuum_outline, $mdi_silverware_fork_knife]
  - file: 'assets/fonts/materialdesignicons-webfont.ttf'
    id: mdi_vac_30
    size: 30
    bpp: 4
    glyphs: [$mdi_floor_plan, $mdi_timer_outline, $mdi_progress_clock, $mdi_history,
             $mdi_information_outline, $mdi_counter, $mdi_battery_high, $mdi_battery_medium,
             $mdi_battery_low]

lvgl:
  pages:
    - id: vacuum_page
      styles: page_style
      <<: !include nav2d-swipe.yaml
      on_load:
        - script.execute: {id: nav_arrive, f: $vacuum_nav_f, p: $vacuum_nav_p}
        - script.execute: vac_render
      widgets:
        # ── HERO: robot glyph + STATE word ──
        - label:
            id: ic_vac_robot
            clickable: false
            align: TOP_LEFT
            x: 44
            y: 108
            text: $mdi_robot_vacuum
            text_font: mdi_vac_64
            text_color: ep_blue
        - label:
            id: lbl_vac_state
            clickable: false
            align: TOP_LEFT
            x: 126
            y: 116
            text: "—"
            text_font: oswald_42
            text_color: ep_blue

        # ── PROGRESS (cleaning only): bar + "% cleaned" ──
        - obj:
            id: vac_prog_wrap
            hidden: true
            clickable: false
            scrollable: false
            align: TOP_MID
            x: 0
            y: 188
            width: 626
            height: 28
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout: {type: flex, flex_flow: ROW, flex_align_main: START, flex_align_cross: CENTER, pad_column: 14}
            widgets:
              - bar:
                  id: vac_prog_bar
                  clickable: false
                  width: 470
                  height: 14
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: gray900
                  bg_opa: cover
                  border_width: 1
                  border_color: 0x2A2F36
                  radius: 7
                  indicator:
                    bg_color: ep_orange
                    bg_opa: cover
                    radius: 7
              - label:
                  id: lbl_vac_prog
                  clickable: false
                  text: "0% cleaned"
                  text_font: oswald_18
                  text_color: ep_orange

        # ── BANNER: OK (blue) / FAULT (red) — stacked, one shown by vac_render ──
        - obj:
            id: vac_banner_ok
            clickable: false
            scrollable: false
            align: TOP_MID
            x: 0
            y: 224
            width: 626
            height: 52
            bg_color: 0x06222A
            bg_opa: cover
            radius: 13
            border_width: 1
            border_color: 0x0C5266
            pad_all: 0
            layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 12}
            widgets:
              - label: {clickable: false, text: $mdi_shield_check, text_font: mdi_vac_36, text_color: ep_blue}
              - label: {clickable: false, text: "All systems nominal", text_font: oswald_20, text_color: ep_blue}
        - obj:
            id: vac_banner_fault
            hidden: true
            clickable: false
            scrollable: false
            align: TOP_MID
            x: 0
            y: 224
            width: 626
            height: 52
            bg_color: 0x2A1012
            bg_opa: cover
            radius: 13
            border_width: 1
            border_color: 0x7A2B2C
            pad_left: 18
            pad_right: 18
            pad_top: 0
            pad_bottom: 0
            layout: {type: flex, flex_flow: ROW, flex_align_main: START, flex_align_cross: CENTER, pad_column: 14}
            widgets:
              - label: {clickable: false, text: $mdi_alert_octagon, text_font: mdi_vac_36, text_color: 0xFF4D4F}
              - obj:
                  clickable: false
                  scrollable: false
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: START, pad_row: 1}
                  widgets:
                    - label: {id: lbl_vac_fault_t, clickable: false, text: "FAULT", text_font: oswald_24, text_color: 0xFF9A9B}
                    - label: {id: lbl_vac_fault_s, clickable: false, text: "", text_font: oswald_14, text_color: 0xC9AAAA}

        # ── CONTEXT PRIMARY: big split button + side button ──
        - button:
            id: vac_btn_primary
            align: TOP_LEFT
            x: 44
            y: 296
            width: 458
            height: 112
            radius: 20
            bg_color: ep_orange
            border_width: 0
            pad_all: 0
            widgets:
              - obj:
                  clickable: false
                  scrollable: false
                  align: CENTER
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 16}
                  widgets:
                    - label: {id: ic_vac_primary, clickable: false, text: $mdi_play, text_font: mdi_vac_46, text_color: 0x1A0C02}
                    - obj:
                        clickable: false
                        scrollable: false
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: START, pad_row: 1}
                        widgets:
                          - label: {id: lbl_vac_prim_small, clickable: false, text: "START", text_font: oswald_14, text_color: 0x3A1A05}
                          - label: {id: lbl_vac_prim_big, clickable: false, text: "$routine_default_label", text_font: oswald_36, text_color: 0x1A0C02}
            on_click:
              - script.execute: vac_primary_action
        - button:
            id: vac_btn_side
            align: TOP_RIGHT
            x: -52
            y: 296
            width: 122
            height: 112
            radius: 20
            bg_color: 0x101820
            border_width: 1
            border_color: 0x0C6F88
            pad_all: 0
            widgets:
              - obj:
                  clickable: false
                  scrollable: false
                  align: CENTER
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 4}
                  widgets:
                    - label: {id: ic_vac_side, clickable: false, text: $mdi_dots_horizontal, text_font: mdi_vac_46, text_color: ep_blue}
                    - label: {id: lbl_vac_side, clickable: false, text: "MORE", text_font: oswald_14, text_color: ep_blue}
            on_click:
              - script.execute: vac_side_action

        # ── CONTENT PILLS (3, swap by state) ──
        - obj:
            id: vac_pills
            clickable: false
            scrollable: false
            align: TOP_MID
            x: 0
            y: 436
            width: 632
            height: 120
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout: {type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, pad_column: 14}
            widgets:
              - obj:
                  id: vac_pill_0
                  clickable: false
                  scrollable: false
                  width: 198
                  height: 116
                  bg_color: 0x0E141A
                  bg_opa: cover
                  radius: 16
                  border_width: 1
                  border_color: 0x18313A
                  pad_all: 0
                  layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 6}
                  widgets:
                    - label: {id: ic_vac_p0, clickable: false, text: $mdi_floor_plan, text_font: mdi_vac_30, text_color: ep_blue}
                    - label: {id: lbl_vac_p0v, clickable: false, text: "—", text_font: oswald_24, text_color: white}
                    - label: {id: lbl_vac_p0c, clickable: false, text: "ROOM", styles: caption}
              - obj:
                  id: vac_pill_1
                  clickable: false
                  scrollable: false
                  width: 198
                  height: 116
                  bg_color: 0x0E141A
                  bg_opa: cover
                  radius: 16
                  border_width: 1
                  border_color: 0x18313A
                  pad_all: 0
                  layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 6}
                  widgets:
                    - label: {id: ic_vac_p1, clickable: false, text: $mdi_timer_outline, text_font: mdi_vac_30, text_color: ep_blue}
                    - label: {id: lbl_vac_p1v, clickable: false, text: "—", text_font: oswald_24, text_color: white}
                    - label: {id: lbl_vac_p1c, clickable: false, text: "DURATION", styles: caption}
              - obj:
                  id: vac_pill_2
                  clickable: false
                  scrollable: false
                  width: 198
                  height: 116
                  bg_color: 0x0E141A
                  bg_opa: cover
                  radius: 16
                  border_width: 1
                  border_color: 0x18313A
                  pad_all: 0
                  layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 6}
                  widgets:
