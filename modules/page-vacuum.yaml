                pad_left: 18
                pad_right: 18
                pad_top: 0
                pad_bottom: 0
                widgets:
                  - label: {clickable: false, align: LEFT_MID, x: 0, text: $clean_row_1_glyph, text_font: mdi_vac_36, text_color: ep_blue}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: -11, text: "$clean_row_1_label", text_font: oswald_24, text_color: white}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: 13, text: "$clean_row_1_sub", text_font: oswald_14, text_color: 0x7D848D}
                on_click:
                  - homeassistant.action: {action: button.press, data: {entity_id: $clean_row_1_entity}}
                  - script.execute: popup_close
            - button:
                id: vac_row_2
                width: 588
                height: 78
                radius: 15
                bg_color: 0x10171C
                border_width: 1
                border_color: 0x18313A
                pad_left: 18
                pad_right: 18
                pad_top: 0
                pad_bottom: 0
                widgets:
                  - label: {clickable: false, align: LEFT_MID, x: 0, text: $clean_row_2_glyph, text_font: mdi_vac_36, text_color: ep_blue}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: -11, text: "$clean_row_2_label", text_font: oswald_24, text_color: white}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: 13, text: "$clean_row_2_sub", text_font: oswald_14, text_color: 0x7D848D}
                on_click:
                  - homeassistant.action: {action: button.press, data: {entity_id: $clean_row_2_entity}}
                  - script.execute: popup_close

# ── Scripts ──
script:
  # Register the modal with the library popup framework (shared scrim / outside-tap
  # / timeout all close it). popup_close already hides popup_scrim.
  - id: !extend popup_close
    then:
      - lvgl.widget.hide: vac_clean_modal

  # Primary split-button action — branches on the live vacuum state.
  - id: vac_primary_action
    then:
      - if:
          condition:
            lambda: 'return id(vac_state_raw).state == "cleaning" || id(vac_state_raw).state == "returning";'
          then:
            - homeassistant.action: {action: vacuum.return_to_base, data: {entity_id: $vacuum_entity}}
          else:
            - if:
                condition:
                  lambda: 'return id(vac_state_raw).state == "paused";'
                then:
                  - homeassistant.action: {action: vacuum.start, data: {entity_id: $vacuum_entity}}
                else:
                  - homeassistant.action: {action: button.press, data: {entity_id: $routine_default_entity}}

  # Side button action — Pause while cleaning, Dock while paused, else open picker.
  - id: vac_side_action
    then:
      - if:
          condition:
            lambda: 'return id(vac_state_raw).state == "cleaning" || id(vac_state_raw).state == "returning";'
          then:
            - homeassistant.action: {action: vacuum.pause, data: {entity_id: $vacuum_entity}}
          else:
            - if:
                condition:
                  lambda: 'return id(vac_state_raw).state == "paused";'
                then:
                  - homeassistant.action: {action: vacuum.return_to_base, data: {entity_id: $vacuum_entity}}
                else:
                  - lvgl.widget.show: popup_scrim
                  - lvgl.widget.show: vac_clean_modal
                  - script.execute: popup_start_timeout

  # Single source of truth: render the whole page from the HA sensors. Every
  # sensor on_value re-invokes this.
  - id: vac_render
    then:
      - lambda: |-
          char buf[28];
          std::string st = id(vac_state_raw).has_state() ? id(vac_state_raw).state : "";
          bool cleaning = (st == "cleaning" || st == "returning");
          bool paused   = (st == "paused");

          // ── Hero state word + colour ──
          const char* word; uint32_t col;
          if      (st == "cleaning")  { word = "CLEANING";  col = 0xF37320; }
          else if (st == "returning") { word = "RETURNING"; col = 0xF37320; }
          else if (st == "paused")    { word = "PAUSED";    col = 0xF37320; }
          else if (st == "docked")    { word = "DOCKED";    col = 0x01B4DE; }
          else if (st == "idle")      { word = "IDLE";      col = 0x9E9E9E; }
          else if (st == "error")     { word = "ERROR";     col = 0xFF4D4F; }
          else                        { word = "—";    col = 0x9E9E9E; }
          lv_label_set_text(id(lbl_vac_state), word);
          lv_obj_set_style_text_color(id(lbl_vac_state), lv_color_hex(col), 0);
          lv_obj_set_style_text_color(id(ic_vac_robot),  lv_color_hex(col), 0);

          // ── Progress bar (cleaning only) ──
          if (cleaning) {
            lv_obj_clear_flag(id(vac_prog_wrap), LV_OBJ_FLAG_HIDDEN);
            int p = id(vac_progress).has_state() ? (int) id(vac_progress).state : 0;
            lv_bar_set_value(id(vac_prog_bar), p, LV_ANIM_OFF);
            snprintf(buf, sizeof(buf), "%d%% cleaned", p);
            lv_label_set_text(id(lbl_vac_prog), buf);
          } else {
            lv_obj_add_flag(id(vac_prog_wrap), LV_OBJ_FLAG_HIDDEN);
          }

          // ── Context primary + side buttons ──
          if (cleaning) {
            lv_obj_set_style_bg_color(id(vac_btn_primary), lv_color_hex(0x01B4DE), 0);
            lv_label_set_text(id(ic_vac_primary), "$mdi_home_import_outline");
            lv_obj_set_style_text_color(id(ic_vac_primary), lv_color_hex(0x04222A), 0);
            lv_label_set_text(id(lbl_vac_prim_small), "RETURN");
            lv_label_set_text(id(lbl_vac_prim_big),   "DOCK");
            lv_obj_set_style_text_color(id(lbl_vac_prim_small), lv_color_hex(0x06323D), 0);
            lv_obj_set_style_text_color(id(lbl_vac_prim_big),   lv_color_hex(0x04222A), 0);
            lv_obj_set_style_bg_color(id(vac_btn_side), lv_color_hex(0x1C130A), 0);
            lv_obj_set_style_border_color(id(vac_btn_side), lv_color_hex(0x7A4A1E), 0);
            lv_label_set_text(id(ic_vac_side), "$mdi_pause");
            lv_obj_set_style_text_color(id(ic_vac_side), lv_color_hex(0xF37320), 0);
            lv_label_set_text(id(lbl_vac_side), "PAUSE");
            lv_obj_set_style_text_color(id(lbl_vac_side), lv_color_hex(0xF37320), 0);
          } else if (paused) {
            lv_obj_set_style_bg_color(id(vac_btn_primary), lv_color_hex(0xF37320), 0);
            lv_label_set_text(id(ic_vac_primary), "$mdi_play");
            lv_obj_set_style_text_color(id(ic_vac_primary), lv_color_hex(0x1A0C02), 0);
            lv_label_set_text(id(lbl_vac_prim_small), "CONTINUE");
            lv_label_set_text(id(lbl_vac_prim_big),   "RESUME");
            lv_obj_set_style_text_color(id(lbl_vac_prim_small), lv_color_hex(0x3A1A05), 0);
            lv_obj_set_style_text_color(id(lbl_vac_prim_big),   lv_color_hex(0x1A0C02), 0);
            lv_obj_set_style_bg_color(id(vac_btn_side), lv_color_hex(0x101820), 0);
            lv_obj_set_style_border_color(id(vac_btn_side), lv_color_hex(0x0C6F88), 0);
            lv_label_set_text(id(ic_vac_side), "$mdi_home_import_outline");
            lv_obj_set_style_text_color(id(ic_vac_side), lv_color_hex(0x01B4DE), 0);
            lv_label_set_text(id(lbl_vac_side), "DOCK");
            lv_obj_set_style_text_color(id(lbl_vac_side), lv_color_hex(0x01B4DE), 0);
          } else {
            lv_obj_set_style_bg_color(id(vac_btn_primary), lv_color_hex(0xF37320), 0);
            lv_label_set_text(id(ic_vac_primary), "$mdi_play");
            lv_obj_set_style_text_color(id(ic_vac_primary), lv_color_hex(0x1A0C02), 0);
            lv_label_set_text(id(lbl_vac_prim_small), "START");
            lv_label_set_text(id(lbl_vac_prim_big),   "$routine_default_label");
            lv_obj_set_style_text_color(id(lbl_vac_prim_small), lv_color_hex(0x3A1A05), 0);
            lv_obj_set_style_text_color(id(lbl_vac_prim_big),   lv_color_hex(0x1A0C02), 0);
            lv_obj_set_style_bg_color(id(vac_btn_side), lv_color_hex(0x101820), 0);
            lv_obj_set_style_border_color(id(vac_btn_side), lv_color_hex(0x0C6F88), 0);
            lv_label_set_text(id(ic_vac_side), "$mdi_dots_horizontal");
            lv_obj_set_style_text_color(id(ic_vac_side), lv_color_hex(0x01B4DE), 0);
            lv_label_set_text(id(lbl_vac_side), "MORE");
            lv_obj_set_style_text_color(id(lbl_vac_side), lv_color_hex(0x01B4DE), 0);
          }

          // ── Content pills (swap by state) ──
          uint32_t pcol = cleaning ? 0xF37320 : 0x01B4DE;
          int secs = id(vac_duration).has_state() ? (int) id(vac_duration).state : 0;
          // M:SS below one hour, H:MM above (so 90 min reads 1:30, not 90:00)
          char dur[12];
          if (secs >= 3600) snprintf(dur, sizeof(dur), "%d:%02d", secs / 3600, (secs % 3600) / 60);
          else              snprintf(dur, sizeof(dur), "%d:%02d", secs / 60, secs % 60);
          if (cleaning || paused) {
            lv_label_set_text(id(ic_vac_p0), "$mdi_floor_plan");
            lv_label_set_text(id(lbl_vac_p0c), "ROOM");
            lv_label_set_text(id(lbl_vac_p0v),
              (id(vac_room).has_state() && !id(vac_room).state.empty()) ? id(vac_room).state.c_str() : "—");
            lv_label_set_text(id(ic_vac_p1), "$mdi_timer_outline");
            lv_label_set_text(id(lbl_vac_p1c), "DURATION");
            lv_label_set_text(id(lbl_vac_p1v), dur);
            lv_label_set_text(id(ic_vac_p2), "$mdi_progress_clock");
            lv_label_set_text(id(lbl_vac_p2c), "PROGRESS");
            { int p = id(vac_progress).has_state() ? (int) id(vac_progress).state : 0;
              snprintf(buf, sizeof(buf), "%d%%", p); lv_label_set_text(id(lbl_vac_p2v), buf); }
          } else {
            lv_label_set_text(id(ic_vac_p0), "$mdi_history");
            lv_label_set_text(id(lbl_vac_p0c), "LAST CLEAN");
            if (secs > 0) lv_label_set_text(id(lbl_vac_p0v), dur);
            else lv_label_set_text(id(lbl_vac_p0v), "—");
            lv_label_set_text(id(ic_vac_p1), "$mdi_information_outline");
            lv_label_set_text(id(lbl_vac_p1c), "STATUS");
            lv_label_set_text(id(lbl_vac_p1v),
              (id(vac_status).has_state() && !id(vac_status).state.empty()) ? id(vac_status).state.c_str() : "—");
            lv_label_set_text(id(ic_vac_p2), "$mdi_counter");
            lv_label_set_text(id(lbl_vac_p2c), "CLEANS");
            { int t = id(vac_total).has_state() ? (int) id(vac_total).state : 0;
              if (t > 0) { snprintf(buf, sizeof(buf), "%d", t); lv_label_set_text(id(lbl_vac_p2v), buf); }
              else lv_label_set_text(id(lbl_vac_p2v), "—"); }
          }
          lv_obj_set_style_text_color(id(ic_vac_p0), lv_color_hex(pcol), 0);
          lv_obj_set_style_text_color(id(ic_vac_p1), lv_color_hex(pcol), 0);
          lv_obj_set_style_text_color(id(ic_vac_p2), lv_color_hex(pcol), 0);

          // ── Bottom bar: Battery (hoover) + Status ──
          { uint32_t bc = 0x9E9E9E; const char* bg = "$mdi_battery_high";  // no state → "—", gray500
            if (id(vac_batt).has_state() && !std::isnan(id(vac_batt).state)) {
              int b = (int) id(vac_batt).state;
              snprintf(buf, sizeof(buf), "%d%%", b); lv_label_set_text(id(lbl_vac_bb_batt), buf);
              bc = 0x01B4DE;
              if      (b <= 15) { bc = 0xFF4D4F; bg = "$mdi_battery_low"; }
              else if (b <= 35) { bc = 0xF37320; bg = "$mdi_battery_medium"; }
            } else {
              lv_label_set_text(id(lbl_vac_bb_batt), "—");
            }
            lv_label_set_text(id(ic_vac_bb_batt), bg);
            lv_obj_set_style_text_color(id(ic_vac_bb_batt), lv_color_hex(bc), 0); }
          lv_label_set_text(id(lbl_vac_bb_status),
            (id(vac_status).has_state() && !id(vac_status).state.empty()) ? id(vac_status).state.c_str() : "—");

          // ── Fault banner ──
          const char* fmsg = nullptr; const char* fsub = nullptr;
          static std::string ferr;
          if (id(vac_err).has_state()) {
            std::string e = id(vac_err).state;
            if (!e.empty() && e != "none" && e != "unknown" && e != "unavailable") { fmsg = "VACUUM ERROR"; ferr = e; fsub = ferr.c_str(); }
          }
          if (!fmsg && id(vac_dock_err).has_state()) {
            std::string e = id(vac_dock_err).state;
            if (!e.empty() && e != "ok" && e != "unknown" && e != "unavailable") { fmsg = "DOCK ERROR"; ferr = e; fsub = ferr.c_str(); }
          }
          if (!fmsg && id(vac_water_short).has_state() && id(vac_water_short).state) { fmsg = "WATER SHORTAGE"; fsub = "Refill the clean-water tank"; }
          if (!fmsg && id(vac_dirty_full).has_state()  && id(vac_dirty_full).state)  { fmsg = "WASTE TANK FULL"; fsub = "Empty the dirty-water tank"; }
          if (!fmsg && id(vac_clean_empty).has_state() && id(vac_clean_empty).state) { fmsg = "CLEAN TANK EMPTY"; fsub = "Refill the clean-water tank"; }
          if (!fmsg && id(vac_mop_att).has_state() && !id(vac_mop_att).state)        { fmsg = "MOP DETACHED"; fsub = "Reattach the mop pad"; }
          if (!fmsg && id(vac_box_att).has_state() && !id(vac_box_att).state)        { fmsg = "WATER BOX OUT"; fsub = "Reinsert the water box"; }
          if (fmsg) {
            lv_label_set_text(id(lbl_vac_fault_t), fmsg);
            lv_label_set_text(id(lbl_vac_fault_s), fsub ? fsub : "");
            lv_obj_clear_flag(id(vac_banner_fault), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(vac_banner_ok), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(vac_banner_fault), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(vac_banner_ok), LV_OBJ_FLAG_HIDDEN);
          }

# ── HA bindings: every on_value re-renders the page (single source of truth) ──
text_sensor:
  - platform: homeassistant
    id: vac_state_raw
    entity_id: $vacuum_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_status
    entity_id: $vacuum_status_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_room
    entity_id: $vacuum_room_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_err
    entity_id: $vacuum_error_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_dock_err
    entity_id: $vacuum_dock_error_entity
    on_value: [{script.execute: vac_render}]

sensor:
  - platform: homeassistant
    id: vac_batt
    entity_id: $vacuum_battery_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_progress
    entity_id: $vacuum_progress_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_duration
    entity_id: $vacuum_duration_entity
    on_value: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_total
    entity_id: $vacuum_total_entity
    on_value: [{script.execute: vac_render}]

binary_sensor:
  - platform: homeassistant
    id: vac_water_short
    entity_id: $vacuum_water_shortage_entity
    on_state: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_dirty_full
    entity_id: $vacuum_dirty_tank_entity
    on_state: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_clean_empty
    entity_id: $vacuum_clean_tank_entity
    on_state: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_mop_att
    entity_id: $vacuum_mop_attached_entity
    on_state: [{script.execute: vac_render}]
  - platform: homeassistant
    id: vac_box_att
    entity_id: $vacuum_box_attached_entity
    on_state: [{script.execute: vac_render}]
