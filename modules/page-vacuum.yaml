                    - label: {id: lbl_vac_p2v, clickable: false, text: "—", text_font: oswald_24, text_color: white}
                    - label: {id: lbl_vac_p2c, clickable: false, text: "PROGRESS", styles: caption}

        # ── BOTTOM BAR (shell_bar): 2 wide status pills — Battery · Status ──
        - obj: {clickable: false, styles: shell_divider, align: BOTTOM_MID, y: -72, width: 100%, height: 1}
        - obj:
            id: vac_botbar
            styles: shell_bar
            clickable: false
            scrollable: false
            align: BOTTOM_MID
            y: 0
            width: 100%
            height: $shell_bar_h
            layout: {type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, pad_column: 0}
            widgets:
              - obj:
                  styles: shell_zone
                  clickable: false
                  scrollable: false
                  width: 344
                  height: $shell_zone_h
                  layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10}
                  widgets:
                    - label: {id: ic_vac_bb_batt, clickable: false, text: $mdi_battery_high, text_font: mdi_vac_30, text_color: ep_blue}
                    - label: {id: lbl_vac_bb_batt, clickable: false, text: "—", text_font: oswald_24, text_color: white}
                    - label: {clickable: false, text: "BATTERY", styles: caption}
              - obj:
                  styles: shell_zone
                  clickable: false
                  scrollable: false
                  width: 344
                  height: $shell_zone_h
                  layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10}
                  widgets:
                    - label: {clickable: false, text: $mdi_information_outline, text_font: mdi_vac_30, text_color: ep_blue}
                    - label: {id: lbl_vac_bb_status, clickable: false, text: "—", text_font: oswald_24, text_color: white}
                    - label: {clickable: false, text: "STATUS", styles: caption}

  # ── "Choose a clean" picker modal (library popup framework, top_layer) ──
  top_layer:
    widgets:
      - obj:
          id: vac_clean_modal
          hidden: true
          align: center
          width: 640
          height: 500
          bg_color: 0x0C1116
          bg_opa: cover
          radius: 24
          border_width: 1
          border_color: 0x143744
          pad_left: 26
          pad_right: 26
          pad_top: 22
          pad_bottom: 22
          scrollable: false
          layout: {type: flex, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: CENTER, pad_row: 12}
          widgets:
            # header
            - obj:
                clickable: false
                scrollable: false
                width: 588
                height: 52
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                widgets:
                  - label: {clickable: false, align: LEFT_MID, x: 0, text: $mdi_robot_vacuum, text_font: mdi_vac_36, text_color: ep_orange}
                  - label: {clickable: false, align: LEFT_MID, x: 48, text: "CHOOSE A CLEAN", text_font: oswald_24, text_color: white}
                  - button:
                      id: vac_modal_close
                      align: RIGHT_MID
                      x: 0
                      y: 0
                      width: 52
                      height: 52
                      radius: 26
                      bg_color: 0x13191E
                      border_width: 1
                      border_color: 0x20424C
                      pad_all: 0
                      widgets:
                        - label: {clickable: false, align: CENTER, text: $mdi_close, text_font: mdi_vac_36, text_color: ep_blue}
                      on_click:
                        - script.execute: popup_close
            # Full Clean (vacuum.start)
            - button:
                id: vac_row_full
                width: 588
                height: 82
                radius: 15
                bg_color: 0x241405
                border_width: 1
                border_color: 0x7A4A1E
                pad_left: 18
                pad_right: 18
                pad_top: 0
                pad_bottom: 0
                widgets:
                  - label: {clickable: false, align: LEFT_MID, x: 0, text: $mdi_home_floor_g, text_font: mdi_vac_36, text_color: ep_orange}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: -12, text: "Full Clean", text_font: oswald_24, text_color: 0xF3C39E}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: 14, text: "Whole home · current settings", text_font: oswald_14, text_color: 0x9A7A58}
                on_click:
                  - homeassistant.action: {action: vacuum.start, data: {entity_id: $vacuum_entity}}
                  - script.execute: popup_close
            # Routine rows (button.press)
            - button:
                id: vac_row_0
                width: 588
                height: 78
                radius: 15
                bg_color: 0x10171C
                border_width: 1
                border_color: 0x0C6F88
                pad_left: 18
                pad_right: 18
                pad_top: 0
                pad_bottom: 0
                widgets:
                  - label: {clickable: false, align: LEFT_MID, x: 0, text: $clean_row_0_glyph, text_font: mdi_vac_36, text_color: ep_blue}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: -11, text: "$clean_row_0_label", text_font: oswald_24, text_color: 0xA6E6F5}
                  - label: {clickable: false, align: LEFT_MID, x: 52, y: 13, text: "$clean_row_0_sub", text_font: oswald_14, text_color: 0x7D848D}
