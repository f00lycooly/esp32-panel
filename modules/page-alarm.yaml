  # ═════════════════════════════════════════════════════════════════════════
  # GLOBAL RINGING OVERLAY (.6) — top_layer, hidden until alarm_ringing set.
  # Shows over WHATEVER page is active (any panel). Snooze / Dismiss write back.
  # ═════════════════════════════════════════════════════════════════════════
  top_layer:
    widgets:
      - obj:
          id: alarm_ringing_overlay
          hidden: true
          align: CENTER
          x: 0
          y: 0
          width: 100%
          height: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          bg_color: 0x08090B
          bg_opa: 92%
          layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 8}
          widgets:
            - obj: {clickable: false, width: 18, height: 18, radius: 9, bg_color: 0x01B4DE, border_width: 0, pad_all: 0, shadow_color: 0x01B4DE, shadow_width: 18, shadow_spread: 2}
            # width:100% + text_align:CENTER → deterministic centring even after the
            # labels are repainted at runtime (LVGL flex won't re-centre a SIZE_CONTENT
            # label after lv_label_set_text — same fix as the energy node values, mv8).
            - label: {id: lbl_al_ring_time, clickable: false, width: 100%, text_align: CENTER, text: "07:00", text_font: oswald_72, text_color: white}
            - label: {id: lbl_al_ring_name, clickable: false, width: 100%, text_align: CENTER, text: "WAKE", text_font: oswald_36, text_color: 0x01B4DE}
            - label: {id: lbl_al_ring_target, clickable: false, width: 100%, text_align: CENTER, text: "${alarm_local_label}", text_font: oswald_18, text_color: gray500}
            - obj:
                clickable: false
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                bg_opa: TRANSP
                border_width: 0
                pad_top: 32
                pad_bottom: 0
                pad_left: 0
                pad_right: 0
                scrollable: false
                layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 22}
                widgets:
                  - button:
                      id: al_ring_snooze_btn
                      width: 220
                      height: 96
                      radius: 20
                      bg_color: 0x14161B
                      border_width: 1
                      border_color: 0x2B3038
                      pad_all: 0
                      on_click: [{script.execute: al_ring_snooze}]
                      widgets:
                        - obj:
                            clickable: false
                            align: CENTER
                            width: SIZE_CONTENT
                            height: SIZE_CONTENT
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            scrollable: false
                            layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 12}
                            widgets:
                              - label: {clickable: false, text: $mdi_alarm_snooze, text_font: mdi_alarm_40, text_color: gray400}
                              - label: {clickable: false, text: "SNOOZE", text_font: oswald_24, text_color: gray400}
                  - button:
                      id: al_ring_dismiss_btn
                      width: 220
                      height: 96
                      radius: 20
                      bg_color: 0x06222B
                      border_width: 1
                      border_color: 0x01B4DE
                      pad_all: 0
                      on_click: [{script.execute: al_ring_dismiss}]
                      widgets:
                        - obj:
                            clickable: false
                            align: CENTER
                            width: SIZE_CONTENT
                            height: SIZE_CONTENT
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            scrollable: false
                            layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 12}
                            widgets:
                              - label: {clickable: false, text: $mdi_check, text_font: mdi_alarm_40, text_color: 0x01B4DE}
                              - label: {clickable: false, text: "DISMISS", text_font: oswald_24, text_color: 0x01B4DE}

# Drive the ringing-overlay big TIME label off the ringing alarm's time. The
# ringing state is the alarm id; find its row in a0..a5 and show field 1 (time).
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return !lv_obj_has_flag(id(alarm_ringing_overlay), LV_OBJ_FLAG_HIDDEN);'
          then:
            - lambda: |-
                std::string r = id(al_ringing_ha).state;
                if (r.empty()) return;
                std::string rows[6] = { id(al_a0), id(al_a1), id(al_a2), id(al_a3), id(al_a4), id(al_a5) };
                for (int i = 0; i < 6; i++) {
                  std::string raw = rows[i]; if (raw.empty()) continue;
                  size_t p = raw.find('|'); std::string aid = (p==std::string::npos)?raw:raw.substr(0,p);
                  if (aid != r) continue;
                  std::string rest = (p==std::string::npos)?std::string(""):raw.substr(p+1);
                  size_t p2 = rest.find('|'); std::string t = (p2==std::string::npos)?rest:rest.substr(0,p2);
                  if (t.size() >= 5) lv_label_set_text(id(lbl_al_ring_time), t.substr(0,5).c_str());
                  break;
                }
