        - obj: {styles: shell_divider, align: TOP_MID, y: $shell_bar_h, width: 100%, height: 1}

        - obj:
            align: TOP_MID
            y: 150
            width: 688
            height: 220
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 30}
