                        on_click: [{script.execute: {id: al_who_pick, ent: ""}}]
                        widgets:
                          - label: {clickable: false, align: CENTER, text: $mdi_account_multiple, text_font: mdi_alarm_40, text_color: gray400}
                    - label: {clickable: false, text: "Anyone", text_font: oswald_24, text_color: white}
