    # ═══════════════════════════════════════════════════════════════════════
    # alarm_music_page — takeover. SpotifyPlus cover grid + Default Sound.
    # ═══════════════════════════════════════════════════════════════════════
    - id: alarm_music_page
      skip: true
      styles: page_style
      widgets:
        - obj:
            styles: shell_bar
            align: TOP_MID
            y: 0
            width: 100%
            height: $shell_bar_h
            scrollable: false
            clickable: false
            layout: {type: flex, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, pad_column: 0}
            widgets:
              - obj:
                  styles: shell_zone
                  width: $shell_side_w
                  height: $shell_zone_h
                  scrollable: false
                  widgets:
                    - button: {id: al_mus_back, align: CENTER, width: 56, height: 56, radius: 28, bg_color: very_dark_gray, border_width: 0, pad_all: 0,
                               widgets: [{label: {clickable: false, align: CENTER, text: $mdi_chevron_left, text_font: mdi_alarm_28, text_color: white}}],
                               on_click: [{lvgl.page.show: alarm_edit_page}]}
              - obj:
                  styles: shell_zone
                  width: $shell_centre_w
                  height: $shell_zone_h
                  scrollable: false
                  widgets: [{label: {clickable: false, align: CENTER, text: "Wake Music", styles: header_title}}]
              - obj: {styles: shell_zone, width: $shell_side_w, height: $shell_zone_h, scrollable: false}
        - obj: {styles: shell_divider, align: TOP_MID, y: $shell_bar_h, width: 100%, height: 1}

        # 4×2 grid of selectable tiles. Tile 0 = Default Sound; 1..7 reuse the
        # SpotifyPlus playlist names (page-media's spotify_playlist_names paints the
        # captions on its own tiles; here we mirror the same playlist_ids/idx scheme).
        - obj:
            align: TOP_MID
            y: 88
            width: 688
            height: 480
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: GRID
              grid_columns: [FR(1), FR(1), FR(1), FR(1)]
              grid_rows: [FR(1), FR(1)]
              pad_column: 14
              pad_row: 14
            widgets:
              - button:
                  id: al_mus_default
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  radius: 14
                  bg_color: 0x23262C
                  border_width: 0
                  pad_all: 0
                  on_click: [{script.execute: {id: al_music_pick_tile, idx: -1}}]
                  widgets:
                    - obj:
                        clickable: false
                        align: CENTER
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 8}
                        widgets:
                          - label: {clickable: false, text: $mdi_bell_ring, text_font: mdi_alarm_40, text_color: gray500}
                          - label: {clickable: false, text: "Default Sound", text_font: oswald_18, text_color: gray400}
              # Playlist tiles (mirror page-media's pl_tile colour-gradient scheme).
              - button: {id: al_mus_0, grid_cell_column_pos: 1, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x6A4FB0, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 0}}], widgets: [{label: {id: al_mus_0_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              - button: {id: al_mus_1, grid_cell_column_pos: 2, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x1F6B63, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 1}}], widgets: [{label: {id: al_mus_1_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              - button: {id: al_mus_2, grid_cell_column_pos: 3, grid_cell_row_pos: 0, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x6B4A1F, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 2}}], widgets: [{label: {id: al_mus_2_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              - button: {id: al_mus_3, grid_cell_column_pos: 0, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x2A3F6B, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 3}}], widgets: [{label: {id: al_mus_3_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              - button: {id: al_mus_4, grid_cell_column_pos: 1, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x7A2F57, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 4}}], widgets: [{label: {id: al_mus_4_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              - button: {id: al_mus_5, grid_cell_column_pos: 2, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x2F6B3A, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 5}}], widgets: [{label: {id: al_mus_5_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              - button: {id: al_mus_6, grid_cell_column_pos: 3, grid_cell_row_pos: 1, grid_cell_x_align: STRETCH, grid_cell_y_align: STRETCH, radius: 14, bg_color: 0x8A3320, border_width: 0, pad_all: 0, on_click: [{script.execute: {id: al_music_pick_tile, idx: 6}}], widgets: [{label: {id: al_mus_6_name, clickable: false, align: BOTTOM_LEFT, x: 10, y: -8, text: "—", text_font: oswald_18, text_color: white}}]}
              # Only 7 playlist tiles fit (4×2 grid, cell 0,0 = Default Sound), so we
              # expose the first 7 SpotifyPlus favourites (idx 0..6). An 8th would
              # overflow — acceptable, the Music picker is "pick from the top of the
              # favourites or Default", not the full library.

