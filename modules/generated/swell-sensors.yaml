# DO NOT EDIT — generated by scripts/gen_swell_panel.py from
# swell-manifest.yaml. Edit the manifest + run `make generate`.
  # ───────── spot 0 ─────────
  - platform: homeassistant
    id: sw0_score
    entity_id: sensor.swelligence_north_beach_panel_detail
    on_value:
      - if:
          condition: {lambda: 'return std::isnan(x);'}
          then:
            - lvgl.label.update: {id: sw0_score_lbl, text: "—"}
          else:
            - lvgl.arc.update: {id: sw0_score_arc, value: !lambda 'return x;'}
            - lvgl.label.update: {id: sw0_score_lbl, text: !lambda 'char b[8]; snprintf(b, sizeof(b), "%.0f", x); return b;'}
  - platform: homeassistant
    id: sw0_wind
    entity_id: sensor.swelligence_north_beach_panel_detail
    attribute: wind_kn
    on_value:
      - if:
          condition: {lambda: 'return std::isnan(x);'}
          then:
            - lvgl.label.update: {id: sw0_wind_lbl, text: "—"}
            - lvgl.label.update: {id: sw0_compass_spd, text: "—"}
          else:
            - lvgl.label.update: {id: sw0_wind_lbl, text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f kn", x); return b;'}
            - lvgl.label.update: {id: sw0_compass_spd, text: !lambda 'char b[8]; snprintf(b, sizeof(b), "%.0f", x); return b;'}
  - platform: homeassistant
    id: sw0_gust
    entity_id: sensor.swelligence_north_beach_panel_detail
    attribute: gust_kn
    on_value:
      - if:
          condition: {lambda: 'return std::isnan(x);'}
          then:
            - lvgl.label.update: {id: sw0_gust_lbl, text: "—"}
            - lvgl.label.update: {id: sw0_compass_gust, text: "—"}
          else:
            - lvgl.label.update: {id: sw0_gust_lbl, text: !lambda 'char b[20]; snprintf(b, sizeof(b), "g %.0f", x); return b;'}
            - lvgl.label.update: {id: sw0_compass_gust, text: !lambda 'char b[20]; snprintf(b, sizeof(b), "gust %.0f", x); return b;'}
  - platform: homeassistant
    id: sw0_wind_dir
    entity_id: sensor.swelligence_north_beach_panel_detail
    attribute: wind_dir_deg
    on_value:
      - if:
          condition: {lambda: 'return std::isnan(x);'}
          then:
            - lvgl.label.update: {id: sw0_compass_card, text: "—"}
          else:
            - lvgl.indicator.update: {id: sw0_wind_needle, value: !lambda 'return fmod(x, 360.0);'}
            - lvgl.label.update:
                id: sw0_compass_card
                text: !lambda |-
                  static const char* C[16]={"N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"};
                  int i=((int)((x/22.5f)+0.5f))%16; if(i<0)i+=16;
                  char b[24]; snprintf(b,sizeof(b),"kn · %s", C[i]); return std::string(b);
