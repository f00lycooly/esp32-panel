# ───────────────────────────────────────────────────────────────────────────
# voice-overlay.yaml — persona voice-assistant phase overlay (HAL / GLaDOS)
#
# A full-screen LVGL top_layer overlay that surfaces the voice-assistant state on
# screen. It READS assist.yaml's `voice_assistant_phase` int global (no shared
# widget ids the other way), so assist.yaml stays LVGL-free and this file owns all
# the presentation — same separation the page packages use.
#
# Two switchable personas (select.voice_persona, restored):
#   HAL    — single glowing red 9000 eye (no housing).
#   GLaDOS — the Aperture personality core. TWO baked raster pieces + ONE live optic
#            (, generate_glados_chassis.py + glados_chassis_contract.json):
#              glados_cavity  BACK  — dark recessed cavity + full-length bellows.
#              LIVE eye             — socket / iris rings / hot / pupil + glow + LED.
#              glados_shell   FRONT — ceramic faceplate (shell-shade + bezel), with
#                                     the aperture CUT OUT. Its opaque ceramic occludes
#                                     the eye outside the opening, so there are NO
#                                     eyelid widgets — the recessed faceplate IS the mask.
#            The aperture/optic sits LEFT of the shell centre (more ceramic right).
#
# MOTION: expression is the eye sliding VERTICALLY inside the aperture
# (top -> centre, never below centre) plus per-phase colour/glow. The eye is the
# `va_optic` container TRANSLATED on y — translate forces NO LVGL transform layer
# (calculate_layer_type, lv_obj_style.c:1089-1091), so the big active face runs clean
# at any size. There is NO head tilt on the active face and NO head-tilt pose-swap;
# rotation/scale are reserved for the small idle cameo only (cheap at that buffer size).
# `va_render` keeps cur/target state in globals and eases (lerps) toward per-phase
# targets, writing a style only when its quantised int changes (settled pose costs 0).
#
# PERF: the dominant cost is core-1 software-rasterising a TRANSFORM layer whenever a
# widget rotates or scales; a translate never builds one. So:
#   • ACTIVE face — baked at display size (288x680) and rendered at IDENTITY (no scale,
#     no rotation). Only the eye/pupil translate + the iris glow (a small dirty rect)
#     redraw. Clean 30fps.
#   • IDLE cameo — the same head scaled ~0.32 into the top-right corner with a head
#     TILT behaviour pool. The transform layer is tiny here and eases-to-park, so it is
#     affordable (shadow-gating still shrinks the bloom while it moves; eps-snap stops
#     phantom relayers after motion ends).
#
# Two display modes, one widget tree:
#   • ACTIVE (listening/thinking/replying/error/timer) — centred, full-size, dark
#     backdrop; per-phase colour + vertical eye motion. Auto-hides on return to idle.
#   • IDLE (phase idle AND the screensaver is the active page) — head scaled into the
#     top-right corner, TRANSPARENT backdrop, organic tilt + eye-look behaviour pool.
#
# Phase ints mirror assist.yaml substitutions (kept in sync by hand):
#   1 idle · 2 listening · 3 thinking · 4 replying · 10 not_ready · 11 error
#   12 muted · 20 timer_finished · 30 timer_finishing
# ───────────────────────────────────────────────────────────────────────────

# Persona is GLaDOS-only: the HAL persona and its "Voice Persona" select
# were removed. va_render hardcodes the GLaDOS chassis path; the HAL red-orb
# branches are stripped out below.

# Display-capture self-registration: the persona owns its
# ?modal=voice-* screenshot helpers. Inert unless the device includes
# modules/display-capture.yaml (capture_mode "on"). See modules/capture/.
packages:
  capture_voice: !include capture/${capture_mode}/voice.yaml

# Baked GLaDOS chassis — two pieces (). Regenerated by
# assets/images/generate_glados_chassis.py (288x680 native = active display size, so
# the active head renders at IDENTITY — no runtime scale → no transform layer).
# RGB565 + alpha_channel: the ceramic doesn't fill its box, the aperture is cut out of
# the shell, and the idle backdrop is transparent — alpha is mandatory (a chroma key
# would halo the AA edges). byte_order little_endian comes from ui-foundation defaults;
# merges with that block via the ESPHome packages list-concat.
image:
  images:
    - {id: glados_cavity, file: 'assets/images/glados_cavity.png', type: RGB565, transparency: alpha_channel}
    - {id: glados_shell,  file: 'assets/images/glados_shell.png',  type: RGB565, transparency: alpha_channel}

globals:
  # Last rendered phase (-1 forces a full repaint on first tick).
  - {id: va_last_phase, type: int, restore_value: false, initial_value: "-1"}
  # Animation tick (advances every render tick) — drives scheduling.
  - {id: va_tick, type: int, restore_value: false, initial_value: "0"}
  # Cameo head-tilt lerp (rotation deg) — idle cameo only.
  - {id: va_cur_rot, type: float, restore_value: false, initial_value: "0"}
  - {id: va_tgt_rot, type: float, restore_value: false, initial_value: "0"}
  # Eye-slide lerp: va_optic translate_y in head px (0 = centre/rest, negative = up to
  # eye_top = -133). The whole optic rides up/down inside the aperture.
  - {id: va_cur_eye, type: float, restore_value: false, initial_value: "0"}
  - {id: va_tgt_eye, type: float, restore_value: false, initial_value: "0"}
  # Pupil dart offset (px), eased.
  - {id: va_cur_px,  type: float, restore_value: false, initial_value: "0"}
  - {id: va_cur_py,  type: float, restore_value: false, initial_value: "0"}
  - {id: va_tgt_px,  type: float, restore_value: false, initial_value: "0"}
  - {id: va_tgt_py,  type: float, restore_value: false, initial_value: "0"}
  - {id: va_ease,    type: float, restore_value: false, initial_value: "0.16"}
  # Schedulers (tick at which the next event fires).
  - {id: va_beh_tick,  type: int, restore_value: false, initial_value: "0"}
  - {id: va_dart_tick, type: int, restore_value: false, initial_value: "0"}
  # Last-APPLIED ints. Perf: write a style ONLY when its int changes — a settled pose
  # then costs nothing (no per-frame re-invalidation).
  - {id: va_app_rot, type: int,  restore_value: false, initial_value: "-99999"}  # va_head rotation*10
  - {id: va_app_sc,  type: int,  restore_value: false, initial_value: "-99999"}  # va_head scale (256=1.0)
  - {id: va_app_tx,  type: int,  restore_value: false, initial_value: "-99999"}  # va_head translate x
  - {id: va_app_ty,  type: int,  restore_value: false, initial_value: "-99999"}  # va_head translate y
  - {id: va_app_eye, type: int,  restore_value: false, initial_value: "-99999"}  # va_optic translate y (eye-slide)
  - {id: va_app_px,  type: int,  restore_value: false, initial_value: "-99999"}  # va_pupilgrp translate x
  - {id: va_app_py,  type: int,  restore_value: false, initial_value: "-99999"}  # va_pupilgrp translate y
  - {id: va_pivot_set, type: bool, restore_value: false, initial_value: "false"}
  # Overlay show-state + applied backdrop opacity. CRITICAL perf gate: writing bg_opa
  # (or clearing HIDDEN) every tick re-invalidates the whole 720x720 overlay each 50ms
  # → continuous full-screen recomposite (the idle core-1 hog). Only write on a
  # show/opacity transition.
  - {id: va_shown,     type: bool, restore_value: false, initial_value: "false"}
  - {id: va_app_bgopa, type: int,  restore_value: false, initial_value: "-1"}
  # True while the 50ms render loop (va_loop) is active. The heartbeat
  # starts the loop on demand and skips while it is already running.
  - {id: va_loop_running, type: bool, restore_value: false, initial_value: "false"}
  # Iris bloom: settled target for the phase + last-applied (gated). The cameo path
  # shrinks it while the head transform-moves and restores on park.
  - {id: va_glow_tgt,   type: int, restore_value: false, initial_value: "30"}
  - {id: va_glow_app,   type: int, restore_value: false, initial_value: "-99999"}

lvgl:
  top_layer:
    widgets:
      - obj:
          id: va_overlay
          hidden: true
          x: 0
          y: 0
          width: 100%
          height: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          bg_color: 0x05060A
          bg_opa: 96%
          widgets:
            # ── The head: a 288x680 container (active display size). Centred on the
            # 720 overlay → fills ~680px vertically at IDENTITY. The idle cameo applies
            # a scale + tilt + translate to this whole container; the active face holds
            # it at identity. Layer order back→front: cavity image, live optic, shell.
            - obj:
                id: va_head
                clickable: false
                align: CENTER
                x: 0
                y: 0
                width: 288
                height: 680
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                widgets:
                  # ── BACK: baked dark cavity + full-length bellows (static). ──
                  - image:
                      id: va_cavity_img
                      src: glados_cavity
                      align: CENTER
                      x: 0
                      y: 0
                      clickable: false
                  # ── va_optic: the LIVE eye + LED. Held at identity for HAL; for GLaDOS
                  # it is TRANSLATED on y to slide the eye in the aperture (no transform
                  # layer). The shell faceplate (next sibling, drawn on top) occludes it
                  # outside the opening — that masking replaces the old eyelids.
                  - obj:
                      id: va_optic
                      clickable: false
                      align: CENTER
                      x: 0
                      y: 0
                      width: 288
                      height: 680
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      widgets:
                        # Eye assembly. Centred at the aperture (offset left of the head
                        # centre by 24px → x:-24). Diameters from the chassis contract.
                        - obj:
                            id: va_eyeball
                            clickable: false
                            align: CENTER
                            x: -24
                            y: 0
                            width: 200
                            height: 200
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            scrollable: false
                            widgets:
                              # Dark socket → dim iris rim → lit iris (+bloom) → hot core.
                              - obj: {id: va_socket, clickable: false, align: CENTER, width: 110, height: 110, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0x08090B, bg_opa: cover}
                              - obj: {id: va_iris3, clickable: false, align: CENTER, width: 94, height: 94, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0x3A0A08, bg_opa: cover}
                              - obj: {id: va_iris,  clickable: false, align: CENTER, width: 73, height: 73, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0xE51E18, bg_opa: cover, shadow_color: 0xE51E18, shadow_width: 40, shadow_spread: 6, shadow_opa: 100%}
                              - obj: {id: va_iris1, clickable: false, align: CENTER, width: 47, height: 47, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0xFFE6E4, bg_opa: cover}
                              # Pupil group (translated for darting): warm pupil + catchlight.
                              - obj:
                                  id: va_pupilgrp
                                  clickable: false
                                  align: CENTER
                                  width: 32
                                  height: 32
                                  bg_opa: TRANSP
                                  border_width: 0
                                  pad_all: 0
                                  scrollable: false
                                  widgets:
                                    - obj: {id: va_pupil, clickable: false, align: CENTER, width: 26, height: 26, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0xFFE855, bg_opa: cover, shadow_color: 0xFFD42E, shadow_width: 6, shadow_spread: 0, shadow_opa: 80%}
                                    - obj: {id: va_catch, clickable: false, align: CENTER, x: -5, y: -6, width: 8, height: 8, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0xFFFFFF, bg_opa: 80%}
                        # Status LED — rides with the optic (down-right of the eye centre).
                        - obj: {id: va_led, clickable: false, align: CENTER, x: 20, y: 29, width: 12, height: 12, radius: 9999, border_width: 0, pad_all: 0, scrollable: false, bg_color: 0xE51E18, bg_opa: cover, shadow_color: 0xE51E18, shadow_width: 8, shadow_spread: 0, shadow_opa: 90%}
                  # ── FRONT: baked ceramic faceplate, aperture cut out (occludes the
                  # eye outside the opening — the mask that replaces the eyelids).
                  - image:
                      id: va_shell_img
                      src: glados_shell
                      align: CENTER
                      x: 0
                      y: 0
                      clickable: false

# Animation scheduling: the fast 50ms render loop runs ONLY while the
# overlay should be visible. Previously a permanent 50ms interval woke the scheduler
# 20x/s forever and merely early-returned when hidden — on the P4 that idle wake
# competes with LVGL. Now a cheap 250ms heartbeat starts va_loop when the overlay
# should show; va_loop renders at 50ms in a while-loop and exits (stops waking)
# once the phase goes inactive. Idle cost is one ~4Hz bool check vs 20Hz of render
# work; active animation is unchanged at 20Hz. Start latency ≤250ms — imperceptible
# for the overlay appearing, and the actual voice phase transition is instant.
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              if (id(va_loop_running)) return false;        // already animating
              // Mirror of va_render's show test: active phases OR the idle screensaver cameo.
              const int ph = id(voice_assistant_phase);
              const bool active = (ph == 2 || ph == 3 || ph == 4 || ph == 11 || ph == 20 || ph == 30);
              const bool idle_show = (ph == 1 && lv_screen_active() == id(screensaver_page)->obj);
              return active || idle_show;
          then:
            - lambda: 'id(va_loop_running) = true;'
            - script.execute: va_loop

script:
  # Fast render loop — runs at 50ms WHILE the overlay should show, then exits so the
  # scheduler stops waking. The trailing va_render fires once more after the
  # while exits so va_render's shown→hidden edge runs (hides the overlay).
  - id: va_loop
    mode: single
    then:
      - while:
          condition:
            lambda: |-
              const int ph = id(voice_assistant_phase);
              const bool active = (ph == 2 || ph == 3 || ph == 4 || ph == 11 || ph == 20 || ph == 30);
              const bool idle_show = (ph == 1 && lv_screen_active() == id(screensaver_page)->obj);
              return active || idle_show;
          then:
            - script.execute: va_render
            - delay: 50ms
      - script.execute: va_render
      - lambda: 'id(va_loop_running) = false;'

  - id: va_render
    then:
      - lambda: |-
          const int ph = id(voice_assistant_phase);
          id(va_tick) += 1;
          const int t = id(va_tick);

          // ── Display mode ──────────────────────────────────────────────────
          const bool active = (ph == 2 || ph == 3 || ph == 4 || ph == 11 || ph == 20 || ph == 30);
          const bool on_ss  = (lv_screen_active() == id(screensaver_page)->obj);
          const bool idle_show = (ph == 1 && on_ss);
          const bool show = active || idle_show;

          if (!show) {
            if (id(va_shown)) {                 // hide only on the shown→hidden edge
              lv_obj_add_flag(id(va_overlay), LV_OBJ_FLAG_HIDDEN);
              id(va_shown) = false;
            }
            return;                             // leave va_last_phase = last SHOWN phase
          }
          // Show + backdrop opacity, GATED (see globals note). Solid while active,
          // transparent for the idle cameo.
          const int bgo = active ? 245 : 0;
          if (!id(va_shown)) {
            lv_obj_clear_flag(id(va_overlay), LV_OBJ_FLAG_HIDDEN);
            id(va_shown) = true;
            id(va_app_bgopa) = -1;              // force bg_opa re-apply on (re)show
          }
          if (bgo != id(va_app_bgopa)) {
            lv_obj_set_style_bg_opa(id(va_overlay), bgo, 0);
            id(va_app_bgopa) = bgo;
          }

          // Re-render on a phase change.
          const bool changed = (id(va_last_phase) != ph);

          // ── On phase change: colours, base targets ──
          if (changed) {
            uint32_t col, rim, hot;
            switch (ph) {
              case 2:  col = 0x30D158; rim = 0x0C3A1C; hot = 0xDFFCE8; break;  // listening
              case 3:  col = 0x2F9FFF; rim = 0x0A2540; hot = 0xE6F3FF; break;  // thinking
              case 4:  col = 0xFFD42E; rim = 0x3A2C08; hot = 0xFFFDE6; break;  // responding
              case 11: col = 0xFF3B30; rim = 0x3A0A08; hot = 0xFFE6E4; break;  // error
              case 1:  col = 0xFFB800; rim = 0x3A2C08; hot = 0xFFF3CC; break;  // idle
              default: col = 0xFFD42E; rim = 0x3A2C08; hot = 0xFFFDE6; break;  // timer
            }
            const lv_color_t c = lv_color_hex(col);

            // GLaDOS ceramic chassis is always shown; va_iris keeps its 73px
            // widget-default size (the old HAL 230px red-orb path is gone).

            // Colour the lit parts.
            lv_obj_set_style_bg_color(id(va_iris), c, 0);
            lv_obj_set_style_shadow_color(id(va_iris), c, 0);
            lv_obj_set_style_bg_color(id(va_iris3), lv_color_hex(rim), 0);
            lv_obj_set_style_bg_color(id(va_iris1), lv_color_hex(hot), 0);
            lv_obj_set_style_bg_color(id(va_led), c, 0);
            lv_obj_set_style_shadow_color(id(va_led), c, 0);

            // Per-state SETTLED iris bloom (error hottest). Applied immediately; the
            // gate below re-asserts/shrinks it.
            id(va_glow_tgt) = (ph == 11) ? 56 : (ph == 4 ? 44 : (ph == 2 ? 40 : 30));
            lv_obj_set_style_shadow_width(id(va_iris), id(va_glow_tgt), 0);
            id(va_glow_app) = -99999;

            // Per-phase eye-slide target (px; 0=centre, up to -73 = socket grounded on the
            // bellows top = eye_slide_grounded_px in glados_chassis_contract.json) + ease.
            if (ph == 2) {        // listening: attentive, eye up
              id(va_tgt_eye) = -55; id(va_tgt_px) = 0; id(va_tgt_py) = 0; id(va_ease) = 0.14;
            } else if (ph == 3) { // thinking: eye mid, flicks (scheduler)
              id(va_tgt_eye) = -22; id(va_tgt_px) = 0; id(va_tgt_py) = 0; id(va_ease) = 0.16;
              id(va_dart_tick) = t;
            } else if (ph == 4) { // responding: vertical eye bob (scheduler) = "talking"
              id(va_beh_tick) = t; id(va_tgt_px) = 0; id(va_tgt_py) = 0; id(va_ease) = 0.22;
            } else if (ph == 11) {// error: snap up, alert
              id(va_tgt_eye) = -73; id(va_tgt_px) = 0; id(va_tgt_py) = 0; id(va_ease) = 0.45;
            } else {              // idle (cameo) + timer: rest (eye centre)
              id(va_tgt_rot) = 0; id(va_tgt_eye) = 0; id(va_tgt_px) = 0; id(va_tgt_py) = 0; id(va_ease) = 0.12;
              id(va_beh_tick) = t + 40; id(va_dart_tick) = t + 20;
            }
            id(va_last_phase) = ph;
          }

          // ── Per-tick behaviour scheduling ─────────────────────────────────
          if (ph == 3) {                         // thinking: vertical eye flicks + darts
            if (t >= id(va_dart_tick)) {
              id(va_tgt_eye) = -6.0f - random_float() * 38.0f;
              id(va_tgt_px)  = (random_float() - 0.5f) * 14.0f;
              id(va_dart_tick) = t + 5 + (int)(random_float() * 14);
            }
          } else if (ph == 4) {                  // responding: vertical eye bob + LED flicker
            if (t >= id(va_beh_tick)) {
              id(va_tgt_eye) = -12.0f - random_float() * 58.0f;   // bob within the grounded bellows band
              id(va_tgt_px)  = (random_float() - 0.5f) * 10.0f;
              id(va_beh_tick) = t + 4 + (int)(random_float() * 8); // ~0.2–0.6s per bob
              lv_obj_set_style_bg_opa(id(va_led), random_float() < 0.5f ? 255 : 150, 0);
            }
          } else if (ph == 1 && !active) {       // idle cameo: tilt + eye-look + darts
            if (t >= id(va_beh_tick)) {
              const float r = random_float();
              if      (r < 0.34f) { id(va_tgt_rot) = 0;   id(va_tgt_eye) = 0;    }  // passive, look centre
              else if (r < 0.50f) { id(va_tgt_rot) = 12;  id(va_tgt_eye) = -12;  }  // scan right
              else if (r < 0.66f) { id(va_tgt_rot) = -12; id(va_tgt_eye) = -12;  }  // scan left
              else if (r < 0.80f) { id(va_tgt_rot) = 6;   id(va_tgt_eye) = -55;  }  // curious, look up
              else if (r < 0.92f) { id(va_tgt_rot) = -4;  id(va_tgt_eye) = -6;   }  // settle
              else                { id(va_tgt_rot) = 0;   id(va_tgt_eye) = -73;  }  // alert, top (grounded)
              id(va_beh_tick) = t + 80 + (int)(random_float() * 180);   // 4–13s dwell
            }
            if (t >= id(va_dart_tick)) {
              id(va_tgt_px) = (random_float() - 0.5f) * 14.0f;
              id(va_tgt_py) = (random_float() - 0.5f) * 8.0f;
              id(va_dart_tick) = t + 24 + (int)(random_float() * 70);
            }
          }

          // ── Lerp current → target ─────────────────────────────────────────
          const float k = id(va_ease);
          id(va_cur_rot) += (id(va_tgt_rot) - id(va_cur_rot)) * k;
          id(va_cur_eye) += (id(va_tgt_eye) - id(va_cur_eye)) * k;
          id(va_cur_px)  += (id(va_tgt_px)  - id(va_cur_px))  * 0.30f;
          id(va_cur_py)  += (id(va_tgt_py)  - id(va_cur_py))  * 0.30f;
          // Eps-snap: stop the quantised ints oscillating after motion ends (kills
          // phantom relayers on the cameo transform path). Thresholds < 1 LSB.
          if (fabsf(id(va_tgt_rot) - id(va_cur_rot)) < 0.05f) id(va_cur_rot) = id(va_tgt_rot);
          if (fabsf(id(va_tgt_eye) - id(va_cur_eye)) < 0.5f)  id(va_cur_eye) = id(va_tgt_eye);
          if (fabsf(id(va_tgt_px)  - id(va_cur_px))  < 0.5f)  id(va_cur_px)  = id(va_tgt_px);
          if (fabsf(id(va_tgt_py)  - id(va_cur_py))  < 0.5f)  id(va_cur_py)  = id(va_tgt_py);

          // ── Apply ─────────────────────────────────────────────────────────
          // active → va_head IDENTITY (no transform layer; the eye-slide is a
          //   va_optic translate). Else (idle cameo) → va_head transform path.
          const bool active_glados = active;

          if (!id(va_pivot_set)) {   // cameo tilt pivots near the top (the "neck")
            lv_obj_set_style_transform_pivot_x(id(va_head), 144, 0);
            lv_obj_set_style_transform_pivot_y(id(va_head), 80, 0);
            id(va_pivot_set) = true;
          }

          if (active_glados) {
            // Hold va_head identity (gated) — never a non-256 scale / non-0 rotation/translate.
            if (id(va_app_rot) != 0)   { lv_obj_set_style_transform_rotation(id(va_head), 0, 0); id(va_app_rot) = 0; }
            if (id(va_app_sc)  != 256) { lv_obj_set_style_transform_scale_x(id(va_head), 256, 0); lv_obj_set_style_transform_scale_y(id(va_head), 256, 0); id(va_app_sc) = 256; }
            if (id(va_app_tx)  != 0)   { lv_obj_set_style_translate_x(id(va_head), 0, 0); id(va_app_tx) = 0; }
            if (id(va_app_ty)  != 0)   { lv_obj_set_style_translate_y(id(va_head), 0, 0); id(va_app_ty) = 0; }
            // Full iris/pupil bloom (cheap at identity — only the eye dirty-rect redraws).
            if (id(va_glow_app) != id(va_glow_tgt)) {
              lv_obj_set_style_shadow_width(id(va_iris), id(va_glow_tgt), 0);
              lv_obj_set_style_shadow_width(id(va_pupil), 6, 0);
              id(va_glow_app) = id(va_glow_tgt);
            }
          } else {
            // Transform path — the idle GLaDOS cameo: scale 0.32 + tilt + translate to
            // the top-right corner. Only reached when idle (mini == true).
            // The head pivots near its TOP (local 144,80 → screen 360,100 pre-translate),
            // so at full ±12° tilt the long body's bottom corner swings to ±85px
            // horizontally and the box spans -35..+198px vertically about the pivot
            // (scale 0.32). Clip-safe in the top-right with ~11px margins on 720x720:
            // pivot_x ≤ 625 (Tx ≤ 264), pivot_y ≥ 45 (Ty ≥ -54).
            const bool mini = idle_show;
            const float arot = mini ? id(va_cur_rot) : 0.0f;
            const float asc  = mini ? 0.32f : 1.0f;
            const int   atx  = mini ? 264 : 0;   // pivot_x 624 → tilt-swing right edge 709
            const int   aty  = mini ? -54 : 0;   // pivot_y 46  → tilt-swing top edge 11
            const int irot = (int)(arot * 10.0f), isc = (int)(asc * 256.0f);
            if (irot != id(va_app_rot)) { lv_obj_set_style_transform_rotation(id(va_head), irot, 0); id(va_app_rot) = irot; }
            if (isc  != id(va_app_sc))  { lv_obj_set_style_transform_scale_x(id(va_head), isc, 0); lv_obj_set_style_transform_scale_y(id(va_head), isc, 0); id(va_app_sc) = isc; }
            if (atx  != id(va_app_tx))  { lv_obj_set_style_translate_x(id(va_head), atx, 0); id(va_app_tx) = atx; }
            if (aty  != id(va_app_ty))  { lv_obj_set_style_translate_y(id(va_head), aty, 0); id(va_app_ty) = aty; }
            if (mini) {
              // Shadow-gating (spq L2): shrink the bloom while the cameo transform-moves,
              // restore on park. "moving" exact via eps-snap (cur==tgt on settle).
              const bool moving = (id(va_cur_rot) != id(va_tgt_rot)) || (id(va_cur_eye) != id(va_tgt_eye));
              const int want = moving ? 8 : id(va_glow_tgt);
              if (want != id(va_glow_app)) {
                lv_obj_set_style_shadow_width(id(va_iris), want, 0);
                lv_obj_set_style_shadow_width(id(va_pupil), moving ? 0 : 6, 0);
                id(va_glow_app) = want;
              }
            }
          }

          // ── Optic translate (eye-slide + pupil dart), gated ───────────────
          const int oty = (int)id(va_cur_eye);
          if (oty != id(va_app_eye)) { lv_obj_set_style_translate_y(id(va_optic), oty, 0); id(va_app_eye) = oty; }
          const int ipx = (int)id(va_cur_px), ipy = (int)id(va_cur_py);
          if (ipx != id(va_app_px) || ipy != id(va_app_py)) {
            lv_obj_set_style_translate_x(id(va_pupilgrp), ipx, 0);
            lv_obj_set_style_translate_y(id(va_pupilgrp), ipy, 0);
            id(va_app_px) = ipx; id(va_app_py) = ipy;
          }
