                  widgets:
                    - label: {clickable: false, text: $mdi_car_electric, text_font: mdi_energy_28, text_color: violet}
                    - label: {id: sk_foot_ev, clickable: false, text: "0.0 kWh EV", text_font: oswald_20, text_color: white}
              - obj:
                  clickable: false
