                  widgets:
                    - label: {clickable: false, text: $mdi_heat_pump, text_font: mdi_energy_28, text_color: orange}
                    - label: {id: sk_foot_hp, clickable: false, text: "0.0 kWh HP", text_font: oswald_20, text_color: white}
              - obj:
