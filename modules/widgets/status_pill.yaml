# ───────────────────────────────────────────────────────────────────────────
# status_pill.yaml — rounded glyph + value pill
#
# A pill (fully-rounded container) holding an MDI glyph + a value label, both
# centred in an auto-sized inner flex box (flex on the container itself is
# unreliable in LVGL 9 — the inner-box trick mirrors the original battery pill).
# Unifies the structurally-identical battery pills on main (150×60) and the
# screensaver (224×84): same markup, sized by var, recoloured by a lambda.
#
# Colour is STATE-DRIVEN, so it is owned by the page's refresh script — this file
# only sets the initial colours. The icon is `ic_${uid}`, the value `lbl_${uid}`,
# the container `${uid}`; a refresh lambda recolours them by SOC / flow / tariff.
#
# Emits a PROPERTY-MAP (no wrapper, no on_click). Merge under `button:` for a
# tappable pill (e.g. battery → energy page) or `obj:` for a static badge:
#
#   - button:
#       <<: !include
#         file: widgets/status_pill.yaml
#         vars: {uid: home_batt, width: 150, height: 60, gap: 9,
#                glyph: $mdi_battery_charging, glyph_font: mdi_home_28, fg: ep_green,
#                value_text: "--%", value_font: oswald_24, value_color: white,
#                bg: gray900, border_width: 1, border_color: ep_green}
#       on_click:
#         - lvgl.page.show: energy_page
#
# vars: uid, width, height, gap, glyph, glyph_font, fg, value_text, value_font,
#       value_color, bg, border_width, border_color
# ───────────────────────────────────────────────────────────────────────────
id: ${uid}
width: ${width}
height: ${height}
radius: 9999          # clamps to half-height → pill ends at any size
bg_color: ${bg}
border_width: ${border_width}
border_color: ${border_color}
pad_all: 0
widgets:
  - obj:
      align: CENTER
      width: SIZE_CONTENT
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollable: false
      clickable: false
      # NB: $var (not ${var}) inside flow mappings — see stat_cell.yaml.
      layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: $gap}
      widgets:
        - label: {id: ic_$uid,  clickable: false, text: $glyph,        text_font: $glyph_font, text_color: $fg}
        - label: {id: lbl_$uid, clickable: false, text: "$value_text", text_font: $value_font, text_color: $value_color}
