# ───────────────────────────────────────────────────────────────────────────
# stepper.yaml — [−] value [+] stepper
#
# A horizontal stepper: a round minus button, a value label, a round plus button.
# Used for the climate setpoint and timer/alarm HH·MM adjusts.
#
# ESPHome !include can't carry per-instance actions to NESTED buttons, so the
# stepper follows the library's abstract-script contract: the buttons call
# `${uid}_dec` / `${uid}_inc`, which the CONSUMING PAGE must define. The page
# owns the value + writes it back to `val_${uid}`:
#
#   - !include {file: widgets/stepper.yaml, vars: {uid: clim_set, value_text: "21°",
#          value_font: oswald_48, fg: white, btn_bg: gray900}}
#   # page-side:
#   #   script: [{id: clim_set_inc, then: [...]}, {id: clim_set_dec, then: [...]}]
#   #   and lv_label_set_text(id(val_clim_set), "...") on change.
#
# ids: ${uid} (row), minus_${uid} / plus_${uid} (buttons), val_${uid} (value).
# vars: uid, value_text, value_font, fg, btn_bg, btn_size (default 56),
#       minus_glyph (default $mdi_minus), plus_glyph (default $mdi_plus)
# ───────────────────────────────────────────────────────────────────────────
id: ${uid}
width: SIZE_CONTENT
height: SIZE_CONTENT
bg_opa: TRANSP
border_width: 0
pad_all: 0
scrollable: false
layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 28}
widgets:
  - button:
      id: minus_${uid}
      width: ${btn_size}
      height: ${btn_size}
      radius: 9999
      bg_color: ${btn_bg}
      border_width: 0
      pad_all: 0
      widgets:
        - label: {clickable: false, align: CENTER, text: $minus_glyph, text_font: mdi_card_28, text_color: $fg}
      on_click:
        - script.execute: ${uid}_dec
  - label: {id: val_$uid, clickable: false, text: "$value_text", text_font: $value_font, text_color: $fg}
  - button:
      id: plus_${uid}
      width: ${btn_size}
      height: ${btn_size}
      radius: 9999
      bg_color: ${btn_bg}
      border_width: 0
      pad_all: 0
      widgets:
        - label: {clickable: false, align: CENTER, text: $plus_glyph, text_font: mdi_card_28, text_color: $fg}
      on_click:
        - script.execute: ${uid}_inc
