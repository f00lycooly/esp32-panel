# ─────────────────────────────────────────────────────────────────────────────
# nav2d.yaml — 2D function×page navigation engine.
# Included as a package by waveshare-p4-86-panel.yaml.
#
# Replaces the flat left/right swipe ring (common/swipe_navigation.yaml). The
# panel is a grid: VERTICAL swipe changes FUNCTION, HORIZONTAL swipe changes
# PAGE within the current function. Stops at both ends (no wrap). Landing on a
# function always lands on that function's HOME page.
#
#   ↕ function   0 MAIN · 1 CLIMATE · 2 TIMER · 3 ENERGY · 4 SWELLIGENCE
#   ↔ page       per-function page list (see PAGES/NPAGES/HOME below)
#
# The function × page layout is NOT hard-coded here: it is the nav_pages_matrix /
# nav_npages / nav_functions contract in the composition root. To add,
# remove or reorder a screen, edit that contract (next to the page_* includes) —
# nav2d internals stay untouched. LVGL constraint: the dots are fixed widgets, so
# ≤5 functions and ≤4 pages/function (one vdot/hdot widget per slot below).
#
# Transitions: function change = vertical slide (OUT_TOP / OUT_BOTTOM); page
# change = horizontal slide (OUT_LEFT / OUT_RIGHT); 300ms (matches the old feel).
#
# Position indicator (top_layer chrome, drawn once over every page):
#   • vertical dots, right edge   = which function (4)
#   • horizontal dots, under bar  = which page in this function (only when >1)
# Hidden on the screensaver (page-screensaver on_load calls nav_chrome with x=0).
#
# Each feature page wires this in two ways:
#   1. `<<: !include modules/nav2d-swipe.yaml`  — the four swipe handlers.
#   2. `on_load: [{script.execute: {id: nav_arrive, f: <func>, p: <page>}}]`
#      — so any non-swipe entry (battery pill → Energy, takeover back, boot)
#      re-syncs the engine's coords + chrome to the page actually shown.
#
# Cross-package ids (resolve after merge): main_page / climate_page / timer_page
# / energy_page (the four feature pages); lvgl top_layer (ui-foundation).
# ─────────────────────────────────────────────────────────────────────────────

globals:
  # Current function index (0..3). Not restored — always boot on MAIN.
  - id: nav_function
    type: int
    restore_value: false
    initial_value: "0"
  # Current page index within the current function (0..NPAGES[func]-1).
  - id: nav_page
    type: int
    restore_value: false
    initial_value: "0"
  # Set true while a takeover (full-screen sub-view or top_layer overlay) is up.
  # nav_go honours it so swipes on the page underneath an overlay can't navigate
  # behind it. Owned by the takeover framework (modules/takeover.yaml, ).
  - id: nav_suspended
    type: bool
    restore_value: false
    initial_value: "false"

script:
  # ── Repaint the position dots from (nav_function, nav_page) ──────────────────
  # Vertical dots = function (green active); horizontal dots = page (blue active),
  # shown only when the current function has more than one page.
  - id: nav_update_dots
    then:
      - lambda: |-
          const int f = id(nav_function);
          const int p = id(nav_page);
          // Page contract — single source of truth in the composition root.
          static const int NFUNC = ${nav_functions};
          static const int NPAGES[${nav_functions}] = ${nav_npages};

          lv_obj_t* vd[5] = {id(nav_vdot0), id(nav_vdot1), id(nav_vdot2), id(nav_vdot3), id(nav_vdot4)};
          lv_obj_t* hd[4] = {id(nav_hdot0), id(nav_hdot1), id(nav_hdot2), id(nav_hdot3)};

          // Off-matrix guard: a reused page may declare coords outside this
          // panel's contract (e.g. Energy's nav_arrive(3,0) reached via the
          // battery pill on a 3-function panel). Hide every dot rather than
          // index NPAGES[] out of bounds.
          if (f < 0 || f >= NFUNC || p < 0 || p >= NPAGES[f]) {
            for (auto* d : vd) lv_obj_add_flag(d, LV_OBJ_FLAG_HIDDEN);
            for (auto* d : hd) lv_obj_add_flag(d, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          for (int i = 0; i < 5; i++) {
            if (i >= NFUNC) { lv_obj_add_flag(vd[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(vd[i], LV_OBJ_FLAG_HIDDEN);
            bool on = (i == f);
            lv_obj_set_style_bg_color(vd[i], lv_color_hex(on ? 0x7ACF38 : 0x3A3F48), 0);
            lv_obj_set_style_shadow_width(vd[i], on ? 8 : 0, 0);
          }

          const int n = NPAGES[f];
          for (int i = 0; i < 4; i++) {
            if (n > 1 && i < n) {
              lv_obj_clear_flag(hd[i], LV_OBJ_FLAG_HIDDEN);
              bool on = (i == p);
              lv_obj_set_style_bg_color(hd[i], lv_color_hex(on ? 0x01B4DE : 0x3A3F48), 0);
              lv_obj_set_style_shadow_width(hd[i], on ? 8 : 0, 0);
            } else {
              lv_obj_add_flag(hd[i], LV_OBJ_FLAG_HIDDEN);
            }
          }

  # ── Show/hide the whole nav chrome (both dot groups) ─────────────────────────
  # x != 0 shows; x == 0 hides (used by full-screen pages: screensaver, info).
  - id: nav_chrome
    parameters:
      x: int
    then:
      - lambda: |-
          // Position dots + the standard top bar are shown on function
          // pages and hidden together on takeovers / the screensaver.
          lv_obj_t* groups[3] = {id(nav_vdots), id(nav_hdots), id(topbar)};
          for (auto* g : groups) {
            if (x) lv_obj_clear_flag(g, LV_OBJ_FLAG_HIDDEN);
            else   lv_obj_add_flag(g, LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            lambda: "return x != 0;"
          then:
            - script.execute: nav_update_dots

  # ── Page declared its coords on load (non-swipe entry) ───────────────────────
  # Off-matrix coords (f/p outside this panel's contract, e.g. Energy's fixed
  # nav_arrive(3,0) on a 3-function panel) are stored as-is ON PURPOSE: the
  # bounds guards in nav_go (swipes → no-op) and nav_update_dots (dots hidden)
  # neutralise them, so an off-matrix page behaves as swipe-suspended. Clamping
  # here would instead make swipes navigate from the wrong grid position.
  - id: nav_arrive
    parameters:
      f: int
      p: int
    then:
      - lambda: |-
          id(nav_function) = f;
          id(nav_page) = p;
      - script.execute: {id: nav_chrome, x: 1}

  # ── Swipe resolver: dir 0=up(next func) 1=down(prev func) 2=left(next page)
  #    3=right(prev page). Computes the target, clamps at the ends (no wrap),
  #    sets coords, then slide-loads the target screen. ────────────────────────
  - id: nav_go
    parameters:
      dir: int
    then:
      - lambda: |-
          // Suspended by a takeover/overlay → swipes must not navigate
          // the page underneath.
          if (id(nav_suspended)) return;
          // Eat the in-flight gesture so it doesn't land as a tap on the new page.
          lv_indev_wait_release(lv_indev_get_act());

          // (function, page) → screen object. Single source of truth: the
          // nav_pages_matrix / nav_npages contract in the composition root.
          // HOME page is index 0 (landing on a function lands on its first page).
          static lv_obj_t* PAGES[${nav_functions}][${nav_pages_per_func}] = {
            ${nav_pages_matrix}
          };
          static const int NPAGES[${nav_functions}] = ${nav_npages};

          int f = id(nav_function);
          int p = id(nav_page);

          // Off-matrix guard: a page outside this panel's contract (e.g. Energy
          // reached via the battery pill on a 3-function panel) declared coords
          // past NFUNC/NPAGES. Treat it as swipe-suspended — indexing
          // NPAGES/PAGES with those coords would be out of bounds.
          if (f < 0 || f >= ${nav_functions} || p < 0 || p >= NPAGES[f]) return;

          int anim = -1;   // LV_SCR_LOAD_ANIM_*; -1 = at an edge, no-op

          switch (dir) {
            case 0:  if (f < ${nav_functions}-1)  { f++; p = 0; anim = LV_SCR_LOAD_ANIM_OUT_TOP;    } break;
            case 1:  if (f > 0)                   { f--; p = 0; anim = LV_SCR_LOAD_ANIM_OUT_BOTTOM; } break;
            case 2:  if (p < NPAGES[f]-1)         { p++;        anim = LV_SCR_LOAD_ANIM_OUT_LEFT;   } break;
            case 3:  if (p > 0)                   { p--;        anim = LV_SCR_LOAD_ANIM_OUT_RIGHT;  } break;
          }
          if (anim < 0) return;                       // hit an end → predictable no-op

          id(nav_function) = f;
          id(nav_page) = p;
          lv_screen_load_anim(PAGES[f][p], (lv_screen_load_anim_t)anim, 300, 0, false);
      - script.execute: nav_update_dots

# ── Position-indicator dots (top_layer chrome over every page) ─────────────────
lvgl:
  top_layer:
    widgets:
      # Vertical function dots — right edge, centred. Five fixed dots.
      - obj:
          id: nav_vdots
          align: RIGHT_MID
          x: -8
          y: 0
          width: 18
          height: 110
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          layout: {type: flex, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 10}
          widgets:
            - obj: {id: nav_vdot0, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x7ACF38, shadow_color: 0x7ACF38, shadow_width: 8, shadow_spread: 1}
            - obj: {id: nav_vdot1, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
            - obj: {id: nav_vdot2, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
            - obj: {id: nav_vdot3, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
            - obj: {id: nav_vdot4, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
      # Horizontal page dots — just under the top bar, centred. Hidden until a
      # function has >1 page (nav_update_dots manages per-dot visibility + colour).
      - obj:
          id: nav_hdots
          hidden: true
          align: TOP_MID
          x: 0
          y: 84
          width: 120
          height: 14
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10}
          widgets:
            - obj: {id: nav_hdot0, hidden: true, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
            - obj: {id: nav_hdot1, hidden: true, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
            - obj: {id: nav_hdot2, hidden: true, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
            - obj: {id: nav_hdot3, hidden: true, width: 10, height: 10, radius: 5, bg_opa: cover, border_width: 0, pad_all: 0, clickable: false, bg_color: 0x3A3F48}
