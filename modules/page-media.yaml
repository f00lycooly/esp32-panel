# ─────────────────────────────────────────────────────────────────────────────
# page-media.yaml — Media page package for the panel.
# Included as a package by waveshare-p4-86-panel.yaml.
#
# Owns: the media_page LVGL page (transport card + 3×3 device-selector grid),
# the active_media_player global, the refresh_device_sel highlight script, the
# 7 per-room media_player bindings (media-room.yaml + media-rooms.h cache), and
# the now-playing sensors derived from the selected room (media_state / title /
# artist / device_name / media_volume) by media_select_sync.
#
# Cross-package IDs (resolved at package merge): nav_tile/card/header_title/
# page_style styles, ep_blue/very_dark_gray/gray500 colours, nunito_*/mdi_*
# fonts and glyph substitutions (library packages), main_page (page-main).
# ─────────────────────────────────────────────────────────────────────────────

# Per-room media_player bindings: one package per compile-time slot. Each binds
# media_player.${media_room_N_slug} directly and caches into media_rooms::rooms()
# (media-rooms.h), replacing the old per-panel HA mirror sensor + input_text and
# the polled sensor.sonos_topology (topology is derived from group_members).
esphome:
  includes:
    - modules/media-rooms.h

packages:
  media_room_0: !include {file: media-room.yaml, vars: {idx: 0, slug: "${media_room_0_slug}", caption: "${media_room_0_caption}"}}
  media_room_1: !include {file: media-room.yaml, vars: {idx: 1, slug: "${media_room_1_slug}", caption: "${media_room_1_caption}"}}
  media_room_2: !include {file: media-room.yaml, vars: {idx: 2, slug: "${media_room_2_slug}", caption: "${media_room_2_caption}"}}
  media_room_3: !include {file: media-room.yaml, vars: {idx: 3, slug: "${media_room_3_slug}", caption: "${media_room_3_caption}"}}
  media_room_4: !include {file: media-room.yaml, vars: {idx: 4, slug: "${media_room_4_slug}", caption: "${media_room_4_caption}"}}
  media_room_5: !include {file: media-room.yaml, vars: {idx: 5, slug: "${media_room_5_slug}", caption: "${media_room_5_caption}"}}
  media_room_6: !include {file: media-room.yaml, vars: {idx: 6, slug: "${media_room_6_slug}", caption: "${media_room_6_caption}"}}

font:
  # ─── Page-local glyphs for the Pick Music + Browse takeovers (.3/.4) ───
  # Every $mdi_* used by pick_music_page / browse_page is declared HERE (the
  # contract requires each page-*.yaml to own its glyphs; ui-shared's mdi fonts
  # have FIXED glyph lists we must not edit). 28px = header chevron + category
  # tile glyphs; 40px = larger cover placeholder glyphs.
  - file: 'assets/fonts/materialdesignicons-webfont.ttf'
    id: mdi_media_28
    size: 28
    bpp: 4
    glyphs:
      - $mdi_chevron_left
      - $mdi_playlist_music
      - $mdi_account_music
      - $mdi_album
      - $mdi_history
      - $mdi_heart
      - $mdi_shape
      - $mdi_speaker             # Rooms-modal tile glyph (otg redesign / Option B)
  - file: 'assets/fonts/materialdesignicons-webfont.ttf'
    id: mdi_media_40
    size: 40
    bpp: 4
    glyphs:
      - $mdi_music
      - $mdi_account
      - $mdi_compass

script:
  # ═══════ Per-room cache → topology + now-playing ═══════
  # Every per-room on_value (media-room.yaml) runs this. mode: restart + a short
  # delay coalesces the burst HA sends on connect / on a group change into one
  # recompute. Event-driven: nothing polls HA.
  - id: media_rooms_changed
    mode: restart
    then:
      - delay: 100ms
      - script.execute: media_topology_sync
      - script.execute: media_select_sync

  # Rebuild the group topology from the per-room group_members (replaces the HA
  # sonos_topology package; same formats, see media_rooms::room_status and
  # playing_groups):
  #   • per room → room_state[] / room_vol[] + apply_room_status("state|coord|size")
  #   • playing (non-TV) groups → sonos_g[0..3] blobs
  #     "coordSlug|playing|vol|label|membersCsv|title|artist|art", sonos_g_count.
  # Rooms with no state yet (HA not connected) keep their defaults.
  - id: media_topology_sync
    then:
      - lambda: |-
          using namespace media_rooms;
          static std::string last_info[kRooms];   // skip unchanged tile repaints
          for (int i = 0; i < kRooms; i++) {
            if (rooms()[i].state.empty()) continue;
            RoomStatus s = room_status(i);
            id(room_state)[i] = s.state;
            id(room_vol)[i] = s.vol;
            std::string info = s.info();
            if (info == last_info[i]) continue;
            last_info[i] = info;
            id(apply_room_status)->execute(i, info);
          }
          std::vector<std::string> gs = playing_groups();
          for (int i = 0; i < 4; i++) id(sonos_g)[i] = i < (int) gs.size() ? gs[i] : std::string();
          id(sonos_g_count) = (int) gs.size();

  # Re-derive everything that follows the SELECTED room (active_media_player)
  # from the per-room cache. Runs on any room change and wherever the selection
  # changes (stage_toggle, prestage, Group, gc_tap, adopt_playing_group).
  #   • media_active_target = group_members[0] of the selected room (Sonos plays
  #     on the coordinator; a grouped member silently no-ops), else the room.
  #     Not overridden for ~3 s after a Group action (group_pending_until_ms).
  #   • media_state / media_title / media_artist / media_device_name /
  #     media_volume / np_art_url (page-main) are published only on change, so
  #     the art fetch doesn't re-fire on unrelated updates.
  # A selection outside the 7 slots (an adopted coordinator that isn't
  # configured) resolves through the first configured room grouped under it.
  - id: media_select_sync
    then:
      - lambda: |-
          using namespace media_rooms;
          int i = resolve_room(id(active_media_player));
          auto pub = [](text_sensor::TextSensor *t, const std::string &v) {
            if (!t->has_state() || t->state != v) t->publish_state(v);
          };
          if (i < 0) {
            pub(id(media_state), "unknown");
            pub(id(media_title), "");
            pub(id(media_artist), "");
            pub(id(media_device_name), "");
            pub(id(np_art_url), "");
            if (!id(media_volume).has_state() || id(media_volume).state != 0.0f)
              id(media_volume).publish_state(0.0f);
            return;
          }
          const Room &r = rooms()[i];
          // Right after a Group action the cache still holds the OLD
          // group_members; keep the target the Group action set until HA
          // reports the new grouping (group_pending_until_ms window).
          uint32_t until = id(group_pending_until_ms);
          if (until == 0 || (int32_t) (until - millis()) <= 0) {
            id(group_pending_until_ms) = 0;
            id(media_active_target) = coord_of(r);
          }
          pub(id(media_state), display_state(r, is_tv(r)));
          pub(id(media_title), r.title);
          pub(id(media_artist), r.artist);
          pub(id(media_device_name), r.caption);
          pub(id(np_art_url), r.art);
          float v = std::isnan(r.volume) ? 0.0f : r.volume;
          if (!id(media_volume).has_state() || id(media_volume).state != v)
            id(media_volume).publish_state(v);

  # Rooms modal: paint each tile from the
  # staged-selection vector with a NO-LEGEND visual: coordinator (index 0) = SOLID
  # ep_blue + dark caption; other staged = faint tint + ep_blue OUTLINE; unstaged =
  # dark. The live play/pause glyph is driven separately by apply_room_status.
  - id: refresh_device_sel
    then:
      - lambda: |-
          auto &v = id(staged_players);
          auto idx = [&](const char* p) -> int {
            for (size_t i = 0; i < v.size(); i++) if (v[i] == p) return (int)i;
            return -1;
          };
          // otg / Option B: gradient cards. Each state is a VER gradient (bg_color
          // top → bg_grad_color bottom) so tiles read as cards on the vdg sheet.
          // Coordinator = ep_blue gradient + HUB chip + dark glyph/caption; member
          // = blue-tint gradient + 2px ep_blue outline; idle = slate gradient.
          auto grad = [](lv_obj_t* o, uint32_t top, uint32_t bot){
            lv_obj_set_style_bg_color(o, lv_color_hex(top), 0);
            lv_obj_set_style_bg_grad_color(o, lv_color_hex(bot), 0);
            lv_obj_set_style_bg_grad_dir(o, LV_GRAD_DIR_VER, 0);
          };
          auto mark = [&](lv_obj_t* tile, lv_obj_t* cap, lv_obj_t* ic, lv_obj_t* chip, const char* player){
            int i = idx(player);
            if (i == 0) {                                  // coordinator: ep_blue gradient + chip
              grad(tile, 0x06CCF5, 0x018FB0);
              lv_obj_set_style_border_width(tile, 0, 0);
              // ui-shared gray tokens (gray500/gray700) — the old 0x06222A ink
              // rendered near-invisible on the panel.
              lv_obj_set_style_text_color(cap, lv_color_hex(0x9E9E9E), 0);
              lv_obj_set_style_text_color(ic,  lv_color_hex(0x616161), 0);
              lv_obj_clear_flag(chip, LV_OBJ_FLAG_HIDDEN);
            } else if (i > 0) {                            // member: tint gradient + ep_blue outline
              grad(tile, 0x143B47, 0x0E2932);
              lv_obj_set_style_border_width(tile, 2, 0);
              lv_obj_set_style_border_color(tile, lv_color_hex(0x01B4DE), 0);
              lv_obj_set_style_text_color(cap, lv_color_hex(0xF2F0EB), 0);
              lv_obj_set_style_text_color(ic,  lv_color_hex(0x01B4DE), 0);
              lv_obj_add_flag(chip, LV_OBJ_FLAG_HIDDEN);
            } else {                                       // idle: slate gradient card
              grad(tile, 0x3A3F4A, 0x23262D);
              lv_obj_set_style_border_width(tile, 1, 0);
              lv_obj_set_style_border_color(tile, lv_color_hex(0x454A55), 0);
              lv_obj_set_style_text_color(cap, lv_color_hex(0xF2F0EB), 0);
              lv_obj_set_style_text_color(ic,  lv_color_hex(0x9BA2BC), 0);
              lv_obj_add_flag(chip, LV_OBJ_FLAG_HIDDEN);
            }
          };
          mark(id(m_living),  id(m_living_cap),  id(m_living_ic),  id(m_living_chip),  "media_player.${media_room_0_slug}");
          mark(id(m_kitchen), id(m_kitchen_cap), id(m_kitchen_ic), id(m_kitchen_chip), "media_player.${media_room_1_slug}");
          mark(id(m_kitchen2),id(m_kitchen2_cap),id(m_kitchen2_ic),id(m_kitchen2_chip),"media_player.${media_room_2_slug}");
          mark(id(m_office),  id(m_office_cap),  id(m_office_ic),  id(m_office_chip),  "media_player.${media_room_3_slug}");
          mark(id(m_bedroom), id(m_bedroom_cap), id(m_bedroom_ic), id(m_bedroom_chip), "media_player.${media_room_4_slug}");
          mark(id(m_garage),  id(m_garage_cap),  id(m_garage_ic),  id(m_garage_chip),  "media_player.${media_room_5_slug}");
          mark(id(m_roam),    id(m_roam_cap),    id(m_roam_ic),    id(m_roam_chip),    "media_player.${media_room_6_slug}");
          int n = (int)v.size();
          if (n == 0) {
            lv_label_set_text(id(lbl_rooms_status), "Tap rooms to group · 1st plays");
          } else {
            char buf[44];
            snprintf(buf, sizeof(buf), "%d room%s grouped · 1st plays from", n, n == 1 ? "" : "s");
            lv_label_set_text(id(lbl_rooms_status), buf);
          }

  # Pre-stage the Rooms modal from LIVE topology (otg follow-up): when the modal
  # opens it should reflect the active room's CURRENT group — coordinator first,
  # then every grouped member — so the modal is a point of EDITING existing groups
  # rather than always starting empty. Reads the sonos_g[] group blobs
  # ("coordSlug|state|vol|label|membersCsv|…"): find the blob holding the active
  # target (as coord OR member), stage its coordinator at index 0 then its members.
  # If the active room is standalone (no blob), stage just it. Run on modal open.
  - id: prestage_from_topology
    then:
      - lambda: |-
          auto known = [](const std::string& s) -> bool {
            return s=="${media_room_0_slug}"||s=="${media_room_1_slug}"||s=="${media_room_2_slug}"||s=="${media_room_3_slug}"
                 ||s=="${media_room_4_slug}"||s=="${media_room_5_slug}"||s=="${media_room_6_slug}";
          };
          // Active target → slug (strip the media_player. domain).
          std::string tgt = id(media_active_target).empty() ? id(active_media_player)
                                                            : id(media_active_target);
          std::string tslug = tgt; { size_t d = tslug.rfind('.'); if (d != std::string::npos) tslug = tslug.substr(d + 1); }
          // Find the group blob whose coordinator or members include the target.
          // Whole-token match over the members list (comma OR space delimited) —
          // a substring test would let "kitchen" match "kitchen_2".
          auto in_members = [](const std::string& m, const std::string& sl) -> bool {
            std::string t;
            for (size_t j = 0; j <= m.size(); j++) {
              char c = (j < m.size()) ? m[j] : ',';
              if (c == ',' || c == ' ') { if (t == sl) return true; t.clear(); }
              else t += c;
            }
            return false;
          };
          std::string coord, members; bool found = false;
          for (int i = 0; i < 4 && !found; i++) {
            std::string s = id(sonos_g)[i];
            if (s.empty()) continue;
            std::vector<std::string> f; size_t p = 0;
            while (true) { size_t q = s.find('|', p);
              f.push_back(q == std::string::npos ? s.substr(p) : s.substr(p, q - p));
              if (q == std::string::npos) break; p = q + 1; }
            if (f.size() < 8) continue;
            if (f[0] == tslug || in_members(f[4], tslug)) { coord = f[0]; members = f[4]; found = true; }
          }
          auto &v = id(staged_players);
          v.clear();
          auto add = [&](const std::string& slug){
            if (!known(slug)) return;
            std::string ent = std::string("media_player.") + slug;
            for (auto &e : v) if (e == ent) return;          // dedupe
            v.push_back(ent);
          };
          if (found) {
            add(coord);                                       // coordinator → index 0
            // Members token list — media_topology_sync joins slugs with commas;
            // spaces are accepted too for robustness.
            std::string tok;
            for (size_t i = 0; i <= members.size(); i++) {
              char ch = (i < members.size()) ? members[i] : ',';
              if (ch == ',' || ch == ' ') { if (!tok.empty()) { add(tok); tok.clear(); } }
              else tok += ch;
            }
          } else {
            add(tslug);                                       // standalone active room
          }
          if (!v.empty()) { id(active_media_player) = v.front(); id(media_active_target) = v.front(); }
      - script.execute: media_select_sync
      - script.execute: refresh_device_sel

  # Rooms modal: toggle a room in the staged vector. If it
  # becomes/loses the front (coordinator), sync active_media_player and re-derive
  # now-playing so transport/now-playing follow the coordinator. Then repaint.
  - id: stage_toggle
    parameters:
      player: string
    then:
      - lambda: |-
          auto &v = id(staged_players);
          bool found = false;
          for (size_t i = 0; i < v.size(); i++) {
            if (v[i] == player) { v.erase(v.begin() + i); found = true; break; }
          }
          if (!found) v.push_back(player);
          id(last_manual_ms) = millis();   // .7: explicit pick → hold auto-follow
          if (!v.empty()) {
            id(active_media_player) = v.front();
            // .5: target the new front IMMEDIATELY so a play right after
            // re-staging hits the right room; media_select_sync then resolves it
            // to that room's live coordinator (group_members[0]).
            id(media_active_target) = v.front();
          }
      # Re-derive only when something is still staged — de-staging the last room
      # leaves the previous selection in place.
      - if:
          condition: {lambda: 'return !id(staged_players).empty();'}
          then:
            - script.execute: media_select_sync
      - script.execute: refresh_device_sel

  # Rooms modal: read a tile's live HA
  # state from its topology string "<state>|<is_coordinator>|<group_size>"
  # (built by media_topology_sync). Drives
  # the self-evident play/pause glyph (play=playing green / pause=paused amber /
  # hidden=idle). Group-role is no longer badged (no-legend redesign) but the live
  # coord/size are still cached so Group can decide whether to free the coordinator.
  - id: apply_room_status
    parameters:
      room: int
      info: string
    then:
      - lambda: |-
          static lv_obj_t* dots[7] = { id(m_living_dot), id(m_kitchen_dot), id(m_kitchen2_dot), id(m_office_dot), id(m_bedroom_dot), id(m_garage_dot), id(m_roam_dot) };
          if (room < 0 || room > 6) return;
          std::string s = info;
          size_t p1 = s.find('|');
          size_t p2 = (p1 == std::string::npos) ? std::string::npos : s.find('|', p1 + 1);
          std::string st = (p1 == std::string::npos) ? s : s.substr(0, p1);
          int coord = 0, size = 1;
          if (p1 != std::string::npos && p2 != std::string::npos) {
            coord = atoi(s.substr(p1 + 1, p2 - p1 - 1).c_str());
            size  = atoi(s.substr(p2 + 1).c_str());
          }
          // Cache live role/size so Group can decide whether to free the coordinator.
          id(room_coord)[room] = coord;
          id(room_size)[room]  = size;
          lv_obj_t* dot = dots[room];
          // Live playback glyph — self-evident, no legend.
          if (st.find("playing") != std::string::npos) {
            lv_label_set_text(dot, "$mdi_play");
            lv_obj_set_style_text_color(dot, lv_color_hex(0x7ACF38), 0);
            lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
          } else if (st.find("paused") != std::string::npos) {
            lv_label_set_text(dot, "$mdi_pause");
            lv_obj_set_style_text_color(dot, lv_color_hex(0xF4A900), 0);
            lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
          }

  # ═══════  — auto-follow the actively-playing group ═══════
  # Now-playing follows the selected room (active_media_player). Nothing repoints it
  # when a DIFFERENT group starts playing, so it would cling to the last-selected (now
  # paused) room. This script, run on the 1s interval (page-main), ADOPTS the single
  # actively-playing group when the current target is NOT playing — repointing the
  # selection so the hero/art/chip follow.
  #   • sonos_g[] holds ONLY playing groups (paused/TV excluded), so a non-empty
  #     slot == a playing group; exactly one non-empty slot == unambiguous, adopt it.
  #   • Never yanks a target that is itself playing (don't interrupt mid-listen), and
  #     honours a 60s hold after an explicit pick (last_manual_ms) so a manual select
  #     of a paused room — about to be played — isn't immediately overridden.
  #   • Ambiguity (0 or >1 playing groups) → no-op; the SEE/SWITCH grid handles it.
  - id: adopt_playing_group
    then:
      - lambda: |-
          id(adopt_target) = "";                       // default: no-op
          if (millis() - id(last_manual_ms) < 60000) return;   // respect a fresh manual pick
          // Count playing groups (non-empty sonos_g slots); capture the sole coordinator.
          int n = 0; std::string coord;
          for (int i = 0; i < 4; i++) {
            const std::string &s = id(sonos_g)[i];
            if (s.empty()) continue;
            n++;
            if (n == 1) { size_t q = s.find('|'); coord = (q == std::string::npos) ? s : s.substr(0, q); }
          }
          if (n != 1 || coord.empty()) return;         // none / ambiguous → leave to SEE/SWITCH
          std::string coordEnt = std::string("media_player.") + coord;
          // Current target — already controlling the playing group? nothing to do.
          std::string tgt = id(media_active_target).empty() ? id(active_media_player)
                                                            : id(media_active_target);
          if (tgt == coordEnt) return;
          // Is the current target itself playing? If so, don't yank the user off it.
          std::string tslug = tgt; { size_t d = tslug.rfind('.'); if (d != std::string::npos) tslug = tslug.substr(d + 1); }
          static const char* R[7] = {"${media_room_0_slug}","${media_room_1_slug}","${media_room_2_slug}","${media_room_3_slug}","${media_room_4_slug}","${media_room_5_slug}","${media_room_6_slug}"};
          for (int i = 0; i < 7; i++) {
            if (tslug == R[i]) { if (id(room_state)[i] == "playing") return; break; }
          }
          id(adopt_target) = coordEnt;                 // commit below
      - if:
          condition:
            lambda: 'return !id(adopt_target).empty();'
          then:
            - lambda: |-
                id(active_media_player) = id(adopt_target);
                id(media_active_target) = id(adopt_target);
            - script.execute: media_select_sync
            - logger.log:
                format: "adopt_playing_group: following %s"
                args: ['id(adopt_target).c_str()']

  # ═══════  — media_play_uri: the ONE playback entry ═══════
  # Plays `uri` on the resolved active room (media_active_target). All play paths
  # call THIS — playlist tiles, Pick Music covers, Browse artists/tracks — so there
  # is exactly one place that decides the target and one place that calls play_media.
  # Sonos resolves spotify: URIs locally (the Connect API can't target Sonos), so
  # spotify:playlist:/album:/artist:/track: all work with content_type=music. No-op
  # on an empty uri/target (guards the "nothing selected / room data not loaded" cases).
  - id: media_play_uri
    parameters:
      uri: string
    then:
      - if:
          condition:
            lambda: 'return !uri.empty() && !id(media_active_target).empty();'
          then:
            - homeassistant.action:
                action: media_player.play_media
                variables:
                  tgt: 'return id(media_active_target);'
                  u: 'return uri;'
                data_template:
                  entity_id: "{{ tgt }}"
                  media_content_id: "{{ u }}"
                  media_content_type: music
            - logger.log:
                format: "media_play_uri: %s -> %s"
                args: ['uri.c_str()', 'id(media_active_target).c_str()']

  # now_playing_dock abstract-script contract:
  # M1's Now Playing dock (uid: npd) calls npd_prev/npd_play/npd_next; implemented
  # here against the SAME resolved active target so transport follows the room the
  # user picked. media_play_pause toggles; prev/next skip on the coordinator.
  - id: npd_prev
    then:
      - homeassistant.action: {action: media_player.media_previous_track, data_template: {entity_id: "{{ tgt }}"}, variables: {tgt: 'return id(media_active_target);'}}
  - id: npd_play
    then:
      - homeassistant.action: {action: media_player.media_play_pause, data_template: {entity_id: "{{ tgt }}"}, variables: {tgt: 'return id(media_active_target);'}}
  - id: npd_next
    then:
      - homeassistant.action: {action: media_player.media_next_track, data_template: {entity_id: "{{ tgt }}"}, variables: {tgt: 'return id(media_active_target);'}}

  # Playlists modal: play grid tile `idx`.
  # Re-adds the "spotify:playlist:" prefix to the bare ID and hands it to the single
  # resolver media_play_uri (which targets the active coordinator). No-op when idx is
  # out of range or the slot is empty (list not loaded / <8 favs).
  - id: play_playlist
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: 'return idx >= 0 && idx < (int) id(playlist_ids).size() && !id(playlist_ids)[idx].empty();'
          then:
            - script.execute:
                id: media_play_uri
                uri: !lambda 'return std::string("spotify:playlist:") + id(playlist_ids)[idx];'
            # Dismiss the modal so the now-playing hero (main_page) shows the result.
            - script.execute: popup_close

  # ═══════ Pick Music takeover ═══════
  # Open: the idle-landing / overlay "Pick" tile (M1, page-main) runs
  #   [{script.execute: takeover_enter}, {lvgl.page.show: pick_music_page}]
  # The page draws its OWN back chevron (takeover_exit) so it hides the floating one.
  # Tile idx tap plays the favourite playlist `idx` on the active room and exits
  # back to Now Playing so the hero shows the result.
  - id: pick_play
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: 'return idx >= 0 && idx < (int) id(playlist_ids).size() && !id(playlist_ids)[idx].empty();'
          then:
            - script.execute:
                id: media_play_uri
                uri: !lambda 'return std::string("spotify:playlist:") + id(playlist_ids)[idx];'
            - script.execute: takeover_exit

  # ═══════ Browse takeover — internal drill-down ═══════
  # browse_show_view paints which of the ONE browse_page's stacked sub-views is
  # visible (0 launcher / 1 Playlists / 2 Artists / 3 Recent-placeholder) and the
  # internal page dots + header title. NOT nav2d — this is private to the takeover.
  - id: browse_show_view
    then:
      - lambda: |-
          int v = id(browse_view);
          lv_obj_t* views[4] = { id(browse_v_home), id(browse_v_playlists), id(browse_v_artists), id(browse_v_recent) };
          for (int i = 0; i < 4; i++) {
            if (i == v) lv_obj_clear_flag(views[i], LV_OBJ_FLAG_HIDDEN);
            else        lv_obj_add_flag(views[i], LV_OBJ_FLAG_HIDDEN);
          }
          const char* titles[4] = { "Browse", "Playlists", "Artists", "Recent" };
          lv_label_set_text(id(lbl_browse_title), titles[v]);
          // Internal page dots: only meaningful inside a paginated sub-view. The
          // launcher (v0) hides them; sub-views show "on" for their own slot. (Real
          // ←→ paging across >8 items is a TODO — see browse_page risks.)
          if (v == 0) lv_obj_add_flag(id(browse_dots), LV_OBJ_FLAG_HIDDEN);
          else        lv_obj_clear_flag(id(browse_dots), LV_OBJ_FLAG_HIDDEN);

  # Enter a category from the launcher (sets the view + repaints).
  - id: browse_open
    parameters:
      view: int
    then:
      - lambda: 'id(browse_view) = view;'
      - script.execute: browse_show_view

  # Back chevron behaviour: if inside a sub-view, return to the launcher (single
  # internal level); if already on the launcher, leave the takeover entirely.
  - id: browse_back
    then:
      - if:
          condition:
            lambda: 'return id(browse_view) != 0;'
          then:
            - lambda: 'id(browse_view) = 0;'
            - script.execute: browse_show_view
          else:
            - script.execute: takeover_exit

  # Play an artist context (Browse › Artists tile). Re-adds spotify:artist: to the
  # bare id, routes through the single resolver, exits back to Now Playing.
  - id: browse_play_artist
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: 'return idx >= 0 && idx < (int) id(artist_ids).size() && !id(artist_ids)[idx].empty();'
          then:
            - script.execute:
                id: media_play_uri
                uri: !lambda 'return std::string("spotify:artist:") + id(artist_ids)[idx];'
            - script.execute: takeover_exit
      # browse_view is reset on the NEXT open (browse tiles always launch on v0).

  # Playlists modal: register the two media modals with the
  # library popup framework so the shared scrim / outside-tap / timeout close
  # them. popup_close already hides popup_scrim; we add our two overlays.
  - id: !extend popup_close
    then:
      - lvgl.widget.hide: rooms_modal
      - lvgl.widget.hide: sources_modal

globals:
  # media_page: entity_id of the media_player the panel currently follows (the
  # selected room). Set by the Rooms modal, gc_tap and adopt_playing_group;
  # media_select_sync derives now-playing + media_active_target from it.
  # restore_value keeps the selection across reboots (panel-local, not an HA entity).
  - id: active_media_player
    type: std::string
    restore_value: true
    initial_value: '"media_player.${media_local_slug}"'
  # : cover-art download serialiser. The 8 Pick covers
  # (sensor.spotify_panel_playlists cover_0..7) and 8 Browse-Artist covers
  # (sensor.spotify_panel_artists cover_0..7) each arrive as one batched HA
  # push, so all 16 online_image fetches used to fire at once -> concurrent
  # downloads + multi-second JPEG decodes starved the ESP-Hosted SDIO RX pool
  # (sdio_drv.c assert) AND exhausted the heap (cxa_allocate_exception abort).
  # Now: on_value only stashes url+want; the cov_pump interval starts ONE fetch
  # at a time. cov_url[i]/cov_want[i] index 0..7 = pm_cover_img_*, 8..15 =
  # ar_cover_img_*, 16..19 = rec_cover_img_* (Recently Played strip, page-main 1ch),
  # 20..22 = al_who_{p1,p2,p3}_img (alarm person photos, page-alarm —
  # routed here so person fetches can't race a cover burst, ). For slots
  # 20..22 page-alarm stashes the FULL pre-proxied URL, so it passes through the
  # pump's `: raw` branch unchanged.
  # cov_inflight gates concurrency; cov_started_ms self-heals a missed
  # on_download_finished after 12s. Not restored (transient).
  # NB: imgs[] below references ids from page-main (rec_*) and page-alarm (al_who_*),
  # so the pump assumes those pages are present (as today). A fully page-independent
  # pump would need runtime registration — tracked as future modularization work.
  - id: cov_url
    type: 'std::array<std::string, 23>'
    restore_value: false
  - id: cov_want
    type: 'std::array<bool, 23>'
    restore_value: false
  - id: cov_inflight
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cov_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Rooms modal: ordered staged-selection of Sonos rooms
  # for grouping. Front element is the coordinator (= active_media_player). Empty
  # = nothing staged. Not restored (group state is live, re-read from HA on boot).
  - id: staged_players
    type: std::vector<std::string>
    restore_value: false
  # Live HA group role/size per room (index 0..6 = media_room_0..6 slots), kept
  # current by apply_room_status from media_topology_sync.
  # Used by Group to decide whether the chosen coordinator must be freed first.
  # Defaults (coord=0, size=1) mean "standalone" -> Group does a non-destructive add.
  - id: room_coord
    type: int[7]
    restore_value: false
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  - id: room_size
    type: int[7]
    restore_value: false
    initial_value: '{1, 1, 1, 1, 1, 1, 1}'
  # Live per-room volume % (0..100; -1 = unknown), set by media_topology_sync.
  # Index order matches room_coord/room_size. Feeds the Rooms
  # Overview grid per-card volume bars ( Step 4b).
  - id: room_vol
    type: int[7]
    restore_value: false
    initial_value: '{-1, -1, -1, -1, -1, -1, -1}'
  # Live per-room state string (playing|paused|idle|tv|unavailable), set by
  # media_topology_sync. Index order matches room_coord. Feeds the Rooms
  # Overview grid idle-room cards ( Step 4b).
  - id: room_state
    type: std::string[7]
    restore_value: false
  # Per-card switch targets for the Rooms Overview grid: gc_coord[slot] = the
  # coordinator entity_id behind visible card `slot` (0..4), or "" for idle/empty.
  # gc_tap reads this to switch which group the panel controls. Painted by mr_refresh.
  - id: gc_coord
    type: std::string[6]
    restore_value: false
  # Playing-group blobs g0..g3 built by media_topology_sync ( Step 4b/4c).
  # Each = "coordSlug|state|vol|label|membersCsv|title|artist|artPath" (art LAST) or
  # "" for an empty slot. Parsed on demand by the Rooms Overview grid + group picker.
  - id: sonos_g
    type: std::string[4]
    restore_value: false
  - id: sonos_g_count
    type: int
    restore_value: false
    initial_value: '0'
  # ═══════ .6 / .7 — multi-room reconcile + auto-follow scratch ═══════
  # last_manual_ms: millis() of the last EXPLICIT room selection (gc_tap card switch
  # or Rooms-modal stage_toggle). adopt_playing_group honours a short hold after a
  # manual pick so auto-follow never yanks the user off a room they just chose.
  - id: last_manual_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # adopt_target: coordinator entity adopt_playing_group decides to follow this tick,
  # or "" for no-op (the lambda computes it; the trailing if-action commits it).
  - id: adopt_target
    type: std::string
    restore_value: false
  # reconcile_unjoin: CSV of media_player.* entities the Rooms-modal Group action must
  # unjoin (live group members the user de-staged). Computed in the Group on_click
  # lambda, consumed by the unjoin action right after. Transient.
  - id: reconcile_unjoin
    type: std::string
    restore_value: false
  # group_pending_until_ms: millis() deadline (~3 s) after a Rooms-modal Group
  # action during which media_select_sync keeps the target the Group action set
  # instead of re-resolving it from the not-yet-updated group_members cache
  # (46t.17.6 window). 0 = no window.
  - id: group_pending_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Playlists modal: BARE base62 playlist IDs for the 8
  # grid tiles, parsed from the ids_8 attribute of sensor.spotify_panel_playlists.
  # Index 0..7 maps to tiles pl_tile_0..7. play_playlist re-adds the
  # "spotify:playlist:" prefix. Not restored (re-published by the HA glue on boot).
  - id: playlist_ids
    type: std::vector<std::string>
    restore_value: false

  # ═══════  — single active-room resolver (THE FIX) ═══════
  # media_active_target is the ONE entity_id that ALL playback targets. It is the
  # resolved group COORDINATOR (Sonos plays on the coordinator; targeting a grouped
  # member silently no-ops — the old bug). Kept current by media_select_sync, which
  # sets it to group_members[0] of the selected room (or the room itself when it is
  # ungrouped / group_members hasn't arrived). EVERY play path (playlist tiles, Pick
  # Music covers, Browse tracks/artists) routes through media_play_uri(uri) → this
  # target. restore_value so the last good coordinator survives a reboot before
  # HA's first push.
  - id: media_active_target
    type: std::string
    restore_value: true
    initial_value: '"media_player.${media_local_slug}"'
  # Bare base62 artist IDs for the Browse › Artists grid (ids_8 of
  # sensor.spotify_panel_artists). browse_play_artist re-adds "spotify:artist:".
  - id: artist_ids
    type: std::vector<std::string>
    restore_value: false
  # Browse takeover internal pager: which sub-view of the
  # ONE browse_page is showing. 0 = category launcher; 1 = Playlists grid; 2 =
  # Artists grid; 3 = Recent/Liked placeholder. Drives browse_show_view + the
  # internal page dots. Not a nav2d page — back chevron always returns to 0 first,
  # then takeover_exit. Not restored (browse always re-opens on the launcher).
  - id: browse_view
    type: int
    restore_value: false
    initial_value: '0'

# : cover-art download serialiser pump. Starts at most ONE
# online_image fetch+decode at a time so concurrent downloads can't starve the
# ESP-Hosted SDIO RX pool or exhaust the heap. Gated by cov_inflight (set here,
# cleared in each cover's on_download_finished) with a 12s self-heal for a
# missed callback, plus is_decoding() as a secondary guard. Covers paint
# progressively (~one per tick). See the globals block above for the model.
#
# DESIGN: polling, NOT trigger-driven — justified. This is the proven
# crash-prevention path for the documented P4/ESP-Hosted SDIO-burst + heap-exhaust
# crash class (see hardware/p4-86-panel.yaml). A 750ms poll that early-exits is the
# LEAST-RISK shape here: the only always-on cost is, per tick (≈1.3 Hz), a single
# cov_inflight check + at most two O(23) scans of trivial pointer/bool ops — far
# below the LVGL render budget and dwarfed by a single JPEG decode. A trigger-driven
# queue would have to re-fire from every enqueue site AND from each
# on_download_finished to keep draining, reintroducing the missed-callback stall the
# 12s self-heal exists to recover from — i.e. more moving parts guarding a crash
# class we already prevent, for an idle saving that is not measurable against LVGL.
#
# ENQUEUE CONTRACT (how a future image-using page joins the pump, /):
#   1. Declare your online_image with `update_interval: never` + an on_download_finished
#      / on_error that BOTH end with `lambda: id(cov_inflight) = false;` (so the pump
#      advances after your fetch).
#   2. Add your image id to the imgs[] array below and bump its size + both loop
#      bounds + the cov_url/cov_want array sizes (globals above).
#   3. To fetch: stash the URL and raise the want flag — NEVER call set_url/update
#      directly (that bypasses the serialiser):
#        id(cov_url)[<slot>] = "<url>"; id(cov_want)[<slot>] = true;
#      Spotify CDN URLs are auto-routed through the imageproxy below; pre-proxied or
#      other-host URLs are used as-is.
interval:
  - interval: 750ms
    then:
      - lambda: |-
          static esphome::online_image::OnlineImage *const imgs[23] = {
            id(pm_cover_img_0), id(pm_cover_img_1), id(pm_cover_img_2), id(pm_cover_img_3),
            id(pm_cover_img_4), id(pm_cover_img_5), id(pm_cover_img_6), id(pm_cover_img_7),
            id(ar_cover_img_0), id(ar_cover_img_1), id(ar_cover_img_2), id(ar_cover_img_3),
            id(ar_cover_img_4), id(ar_cover_img_5), id(ar_cover_img_6), id(ar_cover_img_7),
            id(rec_cover_img_0), id(rec_cover_img_1), id(rec_cover_img_2), id(rec_cover_img_3),
            id(al_who_p1_img), id(al_who_p2_img), id(al_who_p3_img),   // 20..22 person photos
          };
          // Self-heal: clear a stuck inflight if its on_download_finished never fired.
          if (id(cov_inflight) && (millis() - id(cov_started_ms)) > 12000) {
            id(cov_inflight) = false;
          }
          if (id(cov_inflight)) return;
          // Secondary guard: never start a fetch while any cover is still decoding.
          for (int i = 0; i < 23; i++) {
            if (imgs[i]->is_decoding()) return;
          }
          for (int i = 0; i < 23; i++) {
            if (id(cov_want)[i]) {
              id(cov_want)[i] = false;
              id(cov_inflight) = true;
              id(cov_started_ms) = millis();
              // Route Spotify covers through the imageproxy (plain HTTP,
              // pre-resized) to drop panel-side TLS + shrink the download. .
              std::string raw = id(cov_url)[i];
              const char *sz = (i < 8) ? "150x150" : (i < 16) ? "120x120" : "104x104";
              bool spot = raw.find("scdn.co") != std::string::npos || raw.find("spotifycdn.com") != std::string::npos;
              std::string u = spot ? (std::string("${imageproxy_url}/") + sz + "/" + raw) : raw;
              imgs[i]->set_url(u.c_str());
              imgs[i]->update();
              return;
            }
          }
sensor:
  # ───── Media primary volume (follows the selected room) ─────
  # Backend data object only (contract §5): page-main owns the now-playing volume
  # UI (np_vol) and reads this .state (0..1). Published by media_select_sync from
  # the selected room's volume_level.
  - platform: template
    id: media_volume
    internal: true
    update_interval: never

text_sensor:
  # Now-playing backend sensors (contract §5): page-main's np_refresh READS these
  # via .state (state-owned-by-page convention) to paint its hero. Published by
  # media_select_sync from the per-room cache for the selected room:
  #   media_state → play/pause + idle/playing switch (`tv` on an external input)
  #   media_title → track title;  media_device_name → room caption
  #   media_artist → artist line
  - platform: template
    id: media_state
    internal: true
    update_interval: never
  - platform: template
    id: media_title
    internal: true
    update_interval: never
  - platform: template
    id: media_device_name
    internal: true
    update_interval: never
  - platform: template
    id: media_artist
    internal: true
    update_interval: never
  # Playlists modal: the SpotifyPlus glue (spotify_panel.yaml,
  # ) republishes the first 8 favourite playlists as two newline-joined
  # attributes on sensor.spotify_panel_playlists. names_8 → grid tile captions
  # (empty/absent slots hide their tile); ids_8 → the bare-ID lookup table the
  # play_playlist script indexes. Both stay under the ESPHome 255-char cap.
  - platform: homeassistant
    id: spotify_playlist_names
    entity_id: ${spotify_playlists_entity}
    attribute: names_8
    on_value:
      - lambda: |-
          static lv_obj_t* tiles[8] = { id(pl_tile_0), id(pl_tile_1), id(pl_tile_2), id(pl_tile_3),
                                        id(pl_tile_4), id(pl_tile_5), id(pl_tile_6), id(pl_tile_7) };
          static lv_obj_t* names[8] = { id(pl_tile_0_name), id(pl_tile_1_name), id(pl_tile_2_name), id(pl_tile_3_name),
                                        id(pl_tile_4_name), id(pl_tile_5_name), id(pl_tile_6_name), id(pl_tile_7_name) };
          // Drop codepoints above U+00FF (emoji in playlist names) — the Oswald
          // GF_Latin_Core builds have no glyphs for them, so they render as tofu.
          // Keeps ASCII + the 2-byte C2/C3 sequences (U+0080..U+00FF), skips the rest.
          auto strip_hi = [](const std::string& in) -> std::string {
            std::string out; out.reserve(in.size());
            for (size_t j = 0; j < in.size();) {
              unsigned char c = in[j];
              size_t len = (c < 0x80) ? 1 : ((c & 0xE0) == 0xC0) ? 2 : ((c & 0xF0) == 0xE0) ? 3 : 4;
              if (len == 1 || (len == 2 && (c == 0xC2 || c == 0xC3))) out.append(in, j, len);
              j += len;
            }
            while (!out.empty() && out.front() == ' ') out.erase(out.begin());
            while (!out.empty() && out.back() == ' ') out.pop_back();
            return out;
          };
          std::string s = x;
          for (int i = 0; i < 8; i++) {
            size_t nl = s.find('\n');
            std::string name = (i < 7) ? s.substr(0, nl) : s;   // last tile takes the remainder
            if (nl == std::string::npos) name = s;
            name = strip_hi(name);
            if (!name.empty()) {
              lv_label_set_text(names[i], name.c_str());
              lv_obj_clear_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(names[i], "");
              lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (nl == std::string::npos) { s.clear(); }
            else { s = s.substr(nl + 1); }
          }
  - platform: homeassistant
    id: spotify_playlist_ids
    entity_id: ${spotify_playlists_entity}
    attribute: ids_8
    on_value:
      - lambda: |-
          auto &v = id(playlist_ids);
          v.clear();
          std::string s = x;
          while (true) {
            size_t nl = s.find('\n');
            std::string id_str = (nl == std::string::npos) ? s : s.substr(0, nl);
            v.push_back(id_str);
            if (nl == std::string::npos) break;
            s = s.substr(nl + 1);
          }

  # ═══════ Pick Music takeover ═══════
  # Caption labels for the cover grid — reuses names_8 (same source as the modal),
  # painted onto the cover tiles' overlaid title labels (lbl_pm_cov_0..7). Empty
  # slots hide their tile so a <8 favourite list leaves no blanks.
  - platform: homeassistant
    id: spotify_pick_names
    entity_id: ${spotify_playlists_entity}
    attribute: names_8
    on_value:
      - lambda: |-
          // Paints BOTH the Pick Music grid (pm_cov_N) AND the Browse Playlists
          // sub-view (bpl_N) — they share the same favourites source.
          static lv_obj_t* tiles[8]  = { id(pm_cov_0), id(pm_cov_1), id(pm_cov_2), id(pm_cov_3),
                                         id(pm_cov_4), id(pm_cov_5), id(pm_cov_6), id(pm_cov_7) };
          static lv_obj_t* names[8]  = { id(lbl_pm_cov_0), id(lbl_pm_cov_1), id(lbl_pm_cov_2), id(lbl_pm_cov_3),
                                         id(lbl_pm_cov_4), id(lbl_pm_cov_5), id(lbl_pm_cov_6), id(lbl_pm_cov_7) };
          static lv_obj_t* btiles[8] = { id(bpl_0), id(bpl_1), id(bpl_2), id(bpl_3),
                                         id(bpl_4), id(bpl_5), id(bpl_6), id(bpl_7) };
          static lv_obj_t* bnames[8] = { id(lbl_bpl_0), id(lbl_bpl_1), id(lbl_bpl_2), id(lbl_bpl_3),
                                         id(lbl_bpl_4), id(lbl_bpl_5), id(lbl_bpl_6), id(lbl_bpl_7) };
          // Drop codepoints above U+00FF (emoji → tofu) — same skip loop as the
          // Playlists-modal names_8 lambda above.
          auto strip_hi = [](const std::string& in) -> std::string {
            std::string out; out.reserve(in.size());
            for (size_t j = 0; j < in.size();) {
              unsigned char c = in[j];
              size_t len = (c < 0x80) ? 1 : ((c & 0xE0) == 0xC0) ? 2 : ((c & 0xF0) == 0xE0) ? 3 : 4;
              if (len == 1 || (len == 2 && (c == 0xC2 || c == 0xC3))) out.append(in, j, len);
              j += len;
            }
            while (!out.empty() && out.front() == ' ') out.erase(out.begin());
            while (!out.empty() && out.back() == ' ') out.pop_back();
            return out;
          };
          std::string s = x;
          for (int i = 0; i < 8; i++) {
            size_t nl = s.find('\n');
            std::string name = strip_hi((nl == std::string::npos) ? s : s.substr(0, nl));
            if (!name.empty()) {
              lv_label_set_text(names[i], name.c_str());
              lv_label_set_text(bnames[i], name.c_str());
              lv_obj_clear_flag(tiles[i],  LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(btiles[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(names[i], "");
              lv_label_set_text(bnames[i], "");
              lv_obj_add_flag(tiles[i],  LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(btiles[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (nl == std::string::npos) { s.clear(); } else { s = s.substr(nl + 1); }
          }
  # Cover art — ONE attribute per tile (cover_0..7 = Spotify CDN urls, see the HA
  # glue). Each sets its tile's online_image url; empty url leaves the gray800 tile
  # bg (the cover_tile's image just stays blank — acceptable placeholder).
  - platform: homeassistant
    id: spotify_pick_cover_0
    entity_id: ${spotify_playlists_entity}
    attribute: cover_0
    on_value:
      - if: {condition: {lambda: 'return !x.empty();'}, then: [{lambda: 'id(cov_url)[0] = x; id(cov_want)[0] = true;'}]}
  - platform: homeassistant
    id: spotify_pick_cover_1
    entity_id: ${spotify_playlists_entity}
    attribute: cover_1
    on_value:
      - if: {condition: {lambda: 'return !x.empty();'}, then: [{lambda: 'id(cov_url)[1] = x; id(cov_want)[1] = true;'}]}
  - platform: homeassistant
