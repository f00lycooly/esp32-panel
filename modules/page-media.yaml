    format: JPEG
    type: RGB565
    resize: 150x150
    update_interval: never
    on_download_finished: [{lvgl.image.update: {id: img_pm_cov_0, src: pm_cover_img_0}}, {lvgl.image.update: {id: img_bpl_0, src: pm_cover_img_0}}, {lambda: 'id(cov_inflight) = false;'}]
