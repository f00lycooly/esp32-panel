  # ═════════════════════ MODAL OVERLAYS ═════════════════════
  # Popups in the library's top_layer framework: the shared popup_scrim (from
  # popup_system.yaml) dims the hub behind them and an outside-tap runs popup_close
  # (extended above to hide both). Because the scrim is a full-screen clickable
  # sibling, swipe gestures land on it — the hub page underneath does not navigate.
  top_layer:
    widgets:
      # ─── Rooms modal (shell — grouping content lands in ) ───
      - obj:
          id: rooms_modal
          hidden: true
          align: center
          width: 664
          height: 632
          bg_color: very_dark_gray
          bg_opa: cover
          radius: 24
          border_width: 1
          border_color: gray700
          pad_all: 16
          scrollable: false
          widgets:
            - label: {align: TOP_LEFT, x: 6, y: 8, text: "Rooms", styles: header_title}
            - button:
                id: btn_close_rooms
                align: TOP_RIGHT
                x: 0
                y: 0
                width: 52
                height: 52
                radius: 26
                # otg / Option B: gradient + gray700 ring so it reads on the sheet.
                bg_color: 0x3D4250
                bg_grad_color: 0x23262D
                bg_grad_dir: VER
                bg_opa: cover
                border_width: 1
                border_color: gray700
                widgets:
                  - label: {align: center, text: $mdi_close, text_font: mdi_card_28, text_color: gray400}
                on_click:
                  - script.execute: popup_close
            # Selection summary (updated by refresh_device_sel). Green dot on a tile
            # = that room is currently playing (from media_topology_sync).
            - label: {id: lbl_rooms_status, align: TOP_MID, y: 12, text_font: oswald_18, text_color: gray400, text: "Tap rooms to group"}
            # Staged multi-select grid — 7 Sonos rooms.
            # First tap = coordinator (solid ep_blue); further taps = members
            # (ep_blue outline); tap again to deselect. Group joins; Ungroup dissolves.
            - obj:
                align: TOP_MID
                y: 50
                width: 624
                height: 380
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                layout:
                  type: GRID
                  grid_columns: [FR(1), FR(1), FR(1)]
                  grid_rows: [FR(1), FR(1), FR(1)]
                  pad_column: 12
                  pad_row: 12
                widgets:
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_living,   col: 0, row: 0, caption: "${media_room_0_caption}", player: "media_player.${media_room_0_slug}"}}
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_kitchen,  col: 1, row: 0, caption: "${media_room_1_caption}", player: "media_player.${media_room_1_slug}"}}
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_kitchen2, col: 2, row: 0, caption: "${media_room_2_caption}", player: "media_player.${media_room_2_slug}"}}
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_office,   col: 0, row: 1, caption: "${media_room_3_caption}", player: "media_player.${media_room_3_slug}"}}
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_bedroom,  col: 1, row: 1, caption: "${media_room_4_caption}", player: "media_player.${media_room_4_slug}"}}
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_garage,   col: 2, row: 1, caption: "${media_room_5_caption}", player: "media_player.${media_room_5_slug}"}}
                  - !include {file: widgets/tile_media_device.yaml, vars: {tile_id: m_roam,     col: 0, row: 2, caption: "${media_room_6_caption}", player: "media_player.${media_room_6_slug}"}}
            # (No legend — the solid/outline tiles + play/pause glyphs are self-evident, .)
            # Action bar: Group (detach staged + join -> coordinator) / Ungroup (dissolve + clear).
            - obj:
                align: BOTTOM_MID
                y: -2
                width: 624
                height: 84
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                layout: {type: flex, flex_flow: ROW, flex_align_main: SPACE_EVENLY, flex_align_cross: CENTER, pad_column: 16}
                widgets:
                  - button:
                      id: btn_group
                      width: 296
                      height: 72
                      radius: 16
                      # otg / Option B: ep_green gradient to match the tile language.
                      bg_color: 0x8DE04A
                      bg_grad_color: 0x6BB82E
                      bg_grad_dir: VER
                      bg_opa: cover
                      scrollable: false
                      layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10}
                      widgets:
                        - label: {text: $mdi_link_variant, text_font: mdi_icon_40, text_color: black}
                        - label: {text: "Group", text_font: oswald_20, text_color: black}
                      on_click:
                        # Commit & close: dismiss the modal IMMEDIATELY. Hide the modal
                        # + scrim INLINE first — a bare `script.execute: popup_close`
                        # only queues the hide, which the trailing 1000ms delay in this
                        # same handler defers, so the modal lingered ( bugfix).
                        # popup_close still runs to honor the framework contract
                        # (hides sources_modal + clears the auto-close timeout).
                        - lvgl.widget.hide: rooms_modal
                        - lvgl.widget.hide: popup_scrim
                        - script.execute: popup_close
                        # ── .6: RECONCILE the staged set against the LIVE group ──
                        # The modal pre-stages from live topology, so Group must behave as
                        # a group EDITOR, not an additive-only join. Two failures the old
                        # logic had: (1) it UNJOINED the staged front when that room was a
                        # member (silencing the room we meant to KEEP); (2) it never
                        # removed rooms the user DE-staged, and never migrated the
                        # coordinator. New model:
                        #   a. Find the live group blob (sonos_g[]) holding the staged
                        #      front; its members are the CURRENT group.
                        #   b. UNJOIN every live member the user de-staged. Unjoining the
                        #      old coordinator is fine — Sonos promotes a remaining member
                        #      and playback continues there (the desired transfer).
                        #   c. JOIN the staged set under the staged front (size>=2) so
                        #      newly-added rooms join AND the front becomes coordinator.
                        #   d. Re-point the control target at the staged front so the
                        #      control target can't reference a now-silenced room.
                        - lambda: |-
                            id(reconcile_unjoin) = "";
                            auto &v = id(staged_players);
                            if (v.empty()) return;
                            auto slug = [](const std::string& e) -> std::string {
                              size_t d = e.rfind('.'); return d == std::string::npos ? e : e.substr(d + 1);
                            };
                            std::string frontSlug = slug(v.front());
                            // Whole-token match over a comma/space member list —
                            // substring would let "kitchen" match "kitchen_2".
                            auto in_members = [](const std::string& m, const std::string& sl) -> bool {
                              std::string t;
                              for (size_t j = 0; j <= m.size(); j++) {
                                char c = (j < m.size()) ? m[j] : ',';
                                if (c == ',' || c == ' ') { if (t == sl) return true; t.clear(); }
                                else t += c;
                              }
                              return false;
                            };
                            // Live members of the group the front currently belongs to.
                            std::string members;
                            for (int i = 0; i < 4; i++) {
                              const std::string &s = id(sonos_g)[i];
                              if (s.empty()) continue;
                              std::vector<std::string> f; size_t p = 0;
                              while (true) { size_t q = s.find('|', p);
                                f.push_back(q == std::string::npos ? s.substr(p) : s.substr(p, q - p));
                                if (q == std::string::npos) break; p = q + 1; }
                              if (f.size() < 8) continue;
                              if (f[0] == frontSlug || in_members(f[4], frontSlug)) { members = f[4]; break; }
                            }
                            if (members.empty()) return;          // standalone / paused → nothing to unjoin
                            auto inStaged = [&](const std::string& sl) -> bool {
                              for (auto &e : v) if (slug(e) == sl) return true; return false;
                            };
                            // de-staged live members → unjoin CSV (members are comma- or space-joined)
                            std::string out, tok;
                            for (size_t i = 0; i <= members.size(); i++) {
                              char ch = (i < members.size()) ? members[i] : ',';
                              if (ch == ',' || ch == ' ') {
                                if (!tok.empty()) {
                                  if (!inStaged(tok)) { if (!out.empty()) out += ","; out += "media_player." + tok; }
                                  tok.clear();
                                }
                              } else tok += ch;
                            }
                            id(reconcile_unjoin) = out;
                        - if:
                            condition:
                              lambda: 'return !id(reconcile_unjoin).empty();'
                            then:
                              - homeassistant.action:
                                  action: media_player.unjoin
                                  variables:
                                    members: 'return id(reconcile_unjoin);'
                                  data_template:
                                    entity_id: "{{ members.split(',') }}"
                              - delay: 1000ms       # let Sonos promote the new coordinator
                        # Add the staged rooms onto the coordinator (front). Joining rooms
                        # already in the group is a no-op; with the new front as entity_id
                        # this also re-coordinates a coordinator swap.
                        - if:
                            condition:
                              lambda: 'return id(staged_players).size() >= 2;'
                            then:
                              - homeassistant.action:
                                  action: media_player.join
                                  variables:
                                    coord: 'return id(staged_players).front();'
                                    members: |-
                                      std::string s; auto &v = id(staged_players);
                                      for (size_t i = 0; i < v.size(); i++) { if (i) s += ","; s += v[i]; }
                                      return s;
                                  data_template:
                                    entity_id: "{{ coord }}"
                                    group_members: "{{ members.split(',') }}"
                        # Re-point the control target at the resulting coordinator (staged
                        # front) so the cover-art room selector + transport can't diverge
                        # to a silenced room. active_media_player is restored across
                        # reboots; media_select_sync repaints now-playing and re-resolves
                        # the target once HA reports the new group_members.
                        - if:
                            condition:
                              lambda: 'return !id(staged_players).empty();'
                            then:
                              - lambda: |-
                                  id(active_media_player) = id(staged_players).front();
                                  id(media_active_target) = id(staged_players).front();
                                  id(group_pending_until_ms) = millis() + 3000;
                              - script.execute: media_select_sync
                              # Window over: re-resolve the target from the (by now
                              # updated) group_members.
                              - delay: 3100ms
                              - script.execute: media_select_sync
                  - button:
                      id: btn_ungroup
                      width: 296
                      height: 72
                      radius: 16
                      # otg / Option B: slate gradient + gray700 ring so it reads on the sheet.
                      bg_color: 0x3D4250
                      bg_grad_color: 0x23262D
                      bg_grad_dir: VER
                      bg_opa: cover
                      border_width: 1
                      border_color: gray700
                      scrollable: false
                      layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10}
                      widgets:
                        - label: {text: $mdi_link_off, text_font: mdi_icon_40, text_color: white}
                        - label: {text: "Ungroup", text_font: oswald_20, text_color: white}
                      on_click:
                        # Dissolve: unjoin every staged room, then clear the staging.
                        - if:
                            condition:
                              lambda: 'return !id(staged_players).empty();'
                            then:
                              - homeassistant.action:
                                  action: media_player.unjoin
                                  variables:
                                    members: |-
                                      std::string s; auto &v = id(staged_players);
                                      for (size_t i = 0; i < v.size(); i++) { if (i) s += ","; s += v[i]; }
                                      return s;
                                  data_template:
                                    entity_id: "{{ members.split(',') }}"
                        - lambda: 'id(staged_players).clear();'
                        - script.execute: refresh_device_sel
      # ─── Playlists modal (shell — SpotifyPlus list lands in ) ───
      - obj:
          id: sources_modal
          hidden: true
          align: center
          width: 664
          height: 632
          bg_color: very_dark_gray
          bg_opa: cover
          radius: 24
          border_width: 1
          border_color: gray700
          pad_all: 16
          scrollable: false
          widgets:
            - label: {align: TOP_LEFT, x: 6, y: 8, text: "Playlists", styles: header_title}
            - button:
                id: btn_close_sources
                align: TOP_RIGHT
                x: 0
                y: 0
                width: 52
                height: 52
                radius: 26
                bg_color: very_dark_gray
                widgets:
                  - label: {align: center, text: $mdi_close, text_font: mdi_card_28, text_color: white}
                on_click:
                  - script.execute: popup_close
            # Sub-caption. Tiles populate from the SpotifyPlus favourites glue
            #; empty list -> all tiles hidden, only this line shows.
            - label: {id: lbl_sources_status, align: TOP_MID, y: 12, text_font: oswald_18, text_color: gray400, text: "Your favourites · tap to play"}
            # 4×2 grid of colour-gradient playlist tiles.
            # Glyph + gradient per cell are decorative (fixed); the name comes from
            # the names_8 text_sensor and the tap plays playlist `idx` on the
            # active coordinator. No remote cover art (P4-impractical, see widget).
            - obj:
                align: TOP_MID
                y: 50
                width: 632
                height: 330
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                layout:
                  type: GRID
                  grid_columns: [FR(1), FR(1), FR(1), FR(1)]
                  grid_rows: [FR(1), FR(1)]
                  pad_column: 12
                  pad_row: 12
                widgets:
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_0, idx: 0, col: 0, row: 0, glyph: $mdi_heart,               grad_top: 0x6A4FB0, grad_bottom: 0x2A1F52}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_1, idx: 1, col: 1, row: 0, glyph: $mdi_compass,             grad_top: 0x1F6B63, grad_bottom: 0x103B37}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_2, idx: 2, col: 2, row: 0, glyph: $mdi_guitar_acoustic,     grad_top: 0x6B4A1F, grad_bottom: 0x3A2810}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_3, idx: 3, col: 3, row: 0, glyph: $mdi_headphones,          grad_top: 0x2A3F6B, grad_bottom: 0x15203A}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_4, idx: 4, col: 0, row: 1, glyph: $mdi_music_note,          grad_top: 0x7A2F57, grad_bottom: 0x3A1530}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_5, idx: 5, col: 1, row: 1, glyph: $mdi_white_balance_sunny, grad_top: 0x2F6B3A, grad_bottom: 0x163A20}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_6, idx: 6, col: 2, row: 1, glyph: $mdi_run_fast,            grad_top: 0x8A3320, grad_bottom: 0x4A1A10}}
                  - !include {file: widgets/tile_playlist.yaml, vars: {tile_id: pl_tile_7, idx: 7, col: 3, row: 1, glyph: $mdi_saxophone,           grad_top: 0x3A4555, grad_bottom: 0x1F2530}}
