online_image:
  # NOTE: the now-playing hero album art moved to page-main (np_bg_art / np_art_img,
  # 480-px) when the now-playing UI left page-media. page-media no longer fetches
  # hero art — only the Pick-Music / Browse covers below.

  # ═══════ Pick Music cover online_images ═══════
  # One per grid tile (8). URL pushed at runtime from the cover_N attributes; resize
  # to the tile size so the JPEG decoder never chews an oversized CDN source. The
  # cover_tile binds the tile image to img_pm_cov_N (its img_${uid}); on_download_
  # finished repaints it once the fetch completes. Spotify covers are JPEG.
  - id: pm_cover_img_0
