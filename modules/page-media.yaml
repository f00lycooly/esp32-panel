lvgl:
  pages:
    # ═══════════════ PICK MUSIC takeover ═══════════════
    # skip: true → never landed on by a function/page swipe. Reached from M1
    # (page-main idle "Pick" tile + the playing-overlay "Pick" quick-button) via
    #   [{script.execute: takeover_enter}, {lvgl.page.show: pick_music_page}]
    # takeover_enter hides the singleton top bar (nav_chrome 0) + shows the floating
    # back chevron; we draw our OWN header chevron and hide the floating one on_load.
    # NO nav2d-swipe include → function swipes can't fire here. 4×2 cover grid fits
    # 8 recent playlists with no scroll; tap → media_play_uri on the active room.
    - id: pick_music_page
      skip: true
      bg_color: 0x0D0D0D
      bg_opa: cover
      on_load:
        - lvgl.widget.hide: takeover_back     # we host our own header chevron
      widgets:
        # ── Own header (back · title) — top bar is suppressed for takeovers ──
        - button:
            id: pm_back
            align: TOP_LEFT
            x: 16
            y: 8
            width: 56
            height: 56
            radius: 28
            bg_color: very_dark_gray
            border_width: 0
            pad_all: 0
            widgets:
              - label: {clickable: false, align: CENTER, text: $mdi_chevron_left, text_font: mdi_media_28, text_color: white}
            on_click:
              - script.execute: takeover_exit
        - label: {clickable: false, align: TOP_MID, y: 18, text: "Recent Playlists", styles: header_title}
        - obj: {clickable: false, styles: shell_divider, align: TOP_MID, y: 72, width: 100%, height: 1}
        # ── Cover grid (4×2) below the header ──
        - obj:
            align: TOP_MID
            y: 92
            width: 672
            height: 540
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: GRID
              grid_columns: [FR(1), FR(1), FR(1), FR(1)]
              grid_rows: [FR(1), FR(1)]
              pad_column: 14
              pad_row: 14
            widgets:
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_0, src: pm_cover_img_0, caption: "", col: 0, row: 0, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 0}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_1, src: pm_cover_img_1, caption: "", col: 1, row: 0, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 1}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_2, src: pm_cover_img_2, caption: "", col: 2, row: 0, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 2}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_3, src: pm_cover_img_3, caption: "", col: 3, row: 0, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 3}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_4, src: pm_cover_img_4, caption: "", col: 0, row: 1, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 4}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_5, src: pm_cover_img_5, caption: "", col: 1, row: 1, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 5}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_6, src: pm_cover_img_6, caption: "", col: 2, row: 1, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 6}}]
              - button:
                  <<: !include {file: widgets/cover_tile.yaml, vars: {uid: pm_cov_7, src: pm_cover_img_7, caption: "", col: 3, row: 1, caption_font: oswald_18}}
                  on_click: [{script.execute: {id: pick_play, idx: 7}}]

    # ═══════════════ BROWSE takeover ═══════════════
    # ONE skip:true page hosting an INTERNAL drill-down: a category launcher
    # (Playlists/Artists/Albums/Recent/Liked/Genres) whose tiles swap which stacked
    # sub-view is visible (browse_open(view) → browse_show_view). Back chevron runs
    # browse_back: from a sub-view it returns to the launcher; from the launcher it
    # leaves the takeover. No nav_go — paging is private (browse_dots). Reached from
    # M1 via [{script.execute: takeover_enter}, {lvgl.page.show: browse_page}].
    - id: browse_page
      skip: true
      bg_color: 0x0D0D0D
      bg_opa: cover
      on_load:
        - lvgl.widget.hide: takeover_back
        - lambda: 'id(browse_view) = 0;'    # always open on the launcher
        - script.execute: browse_show_view
      widgets:
        - button:
            id: browse_back_btn
            align: TOP_LEFT
            x: 16
            y: 8
            width: 56
            height: 56
            radius: 28
            bg_color: very_dark_gray
            border_width: 0
            pad_all: 0
            widgets:
              - label: {clickable: false, align: CENTER, text: $mdi_chevron_left, text_font: mdi_media_28, text_color: white}
            on_click:
              - script.execute: browse_back
        - label: {id: lbl_browse_title, clickable: false, align: TOP_MID, y: 18, text: "Browse", styles: header_title}
        - obj: {clickable: false, styles: shell_divider, align: TOP_MID, y: 72, width: 100%, height: 1}
        # Internal page dots (shown only inside a paginated sub-view). Single dot for
        # now — real ←→ paging across >8 items is a TODO (see risks).
        - obj:
            id: browse_dots
            hidden: true
            clickable: false
            align: BOTTOM_MID
            y: -16
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 9}
            widgets:
              - obj: {clickable: false, width: 9, height: 9, radius: 5, bg_color: gray400, border_width: 0, pad_all: 0}

        # ─── View 0: category launcher (3×2) ───
        - obj:
            id: browse_v_home
            align: TOP_MID
            y: 92
            width: 672
            height: 540
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: GRID
              grid_columns: [FR(1), FR(1), FR(1)]
              grid_rows: [FR(1), FR(1)]
              pad_column: 16
              pad_row: 16
            widgets:
              - button:
                  <<: !include {file: widgets/category_tile.yaml, vars: {uid: cat_playlists, glyph: $mdi_playlist_music, caption: "Playlists", col: 0, row: 0, bg: 0x14161B, fg: white, glyph_font: mdi_media_28, caption_font: oswald_20}}
                  on_click: [{script.execute: {id: browse_open, view: 1}}]
              - button:
                  <<: !include {file: widgets/category_tile.yaml, vars: {uid: cat_artists, glyph: $mdi_account_music, caption: "Artists", col: 1, row: 0, bg: 0x14161B, fg: white, glyph_font: mdi_media_28, caption_font: oswald_20}}
