  # ═══════ Browse › Artists ═══════
  # names_8 → tile captions (lbl_ar_cov_N); ids_8 → bare artist ids (artist_ids,
  # browse_play_artist re-adds spotify:artist:); cover_N → circular online_image.
  - platform: homeassistant
    id: spotify_artist_names
    entity_id: ${spotify_artists_entity}
    attribute: names_8
    on_value:
      - lambda: |-
          static lv_obj_t* tiles[8] = { id(ar_cov_0), id(ar_cov_1), id(ar_cov_2), id(ar_cov_3),
                                        id(ar_cov_4), id(ar_cov_5), id(ar_cov_6), id(ar_cov_7) };
          static lv_obj_t* names[8] = { id(lbl_ar_cov_0), id(lbl_ar_cov_1), id(lbl_ar_cov_2), id(lbl_ar_cov_3),
                                        id(lbl_ar_cov_4), id(lbl_ar_cov_5), id(lbl_ar_cov_6), id(lbl_ar_cov_7) };
          std::string s = x;
          for (int i = 0; i < 8; i++) {
            size_t nl = s.find('\n');
            std::string name = (nl == std::string::npos) ? s : s.substr(0, nl);
            if (!name.empty()) {
              lv_label_set_text(names[i], name.c_str());
              lv_obj_clear_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(names[i], "");
              lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (nl == std::string::npos) { s.clear(); } else { s = s.substr(nl + 1); }
          }
  - platform: homeassistant
    id: spotify_artist_ids
    entity_id: ${spotify_artists_entity}
    attribute: ids_8
    on_value:
      - lambda: |-
          auto &v = id(artist_ids);
          v.clear();
          std::string s = x;
          while (true) {
            size_t nl = s.find('\n');
            v.push_back((nl == std::string::npos) ? s : s.substr(0, nl));
            if (nl == std::string::npos) break;
            s = s.substr(nl + 1);
          }
  - platform: homeassistant
    id: spotify_artist_cover_0
    entity_id: ${spotify_artists_entity}
    attribute: cover_0
    on_value:
      - if: {condition: {lambda: 'return !x.empty();'}, then: [{lambda: 'id(cov_url)[8] = x; id(cov_want)[8] = true;'}]}
