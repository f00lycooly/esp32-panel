              - button:
                  <<: !include {file: widgets/category_tile.yaml, vars: {uid: cat_albums, glyph: $mdi_album, caption: "Albums", col: 2, row: 0, bg: 0x14161B, fg: white, glyph_font: mdi_media_28, caption_font: oswald_20}}
                  on_click: [{script.execute: {id: browse_open, view: 3}}]
              - button:
                  <<: !include {file: widgets/category_tile.yaml, vars: {uid: cat_recent, glyph: $mdi_history, caption: "Recent", col: 0, row: 1, bg: 0x14161B, fg: white, glyph_font: mdi_media_28, caption_font: oswald_20}}
                  on_click: [{script.execute: {id: browse_open, view: 3}}]
              - button:
                  <<: !include {file: widgets/category_tile.yaml, vars: {uid: cat_liked, glyph: $mdi_heart, caption: "Liked", col: 1, row: 1, bg: 0x14161B, fg: white, glyph_font: mdi_media_28, caption_font: oswald_20}}
                  on_click: [{script.execute: {id: browse_open, view: 3}}]
              - button:
                  <<: !include {file: widgets/category_tile.yaml, vars: {uid: cat_genres, glyph: $mdi_shape, caption: "Genres", col: 2, row: 1, bg: 0x14161B, fg: white, glyph_font: mdi_media_28, caption_font: oswald_20}}
                  on_click: [{script.execute: {id: browse_open, view: 3}}]

        # ─── View 1: Playlists grid (drives the same favourites as Pick Music) ───
        - obj:
            id: browse_v_playlists
            hidden: true
            align: TOP_MID
            y: 92
            width: 672
            height: 524
