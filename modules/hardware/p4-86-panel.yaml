# Local hardware contract for the Waveshare ESP32-P4-86-Panel.
#
# Electrical, framework, PSRAM, ESP Hosted, display, touch, and audio settings
# are taken from the known-working chrisdunnname baseline:
#   esphome-p4-86-panel-eth-2ro-lvgl/esp32-p4-86-panel.yaml
#
# IDs intentionally retain the application-facing names used by Assist and the
# completed page work. Keep hardware changes isolated to this file and verify
# them on-device before changing application packages.
---

substitutions:
  # Screen Size
  screen_height: 720
  screen_width: 720
  # FreeRTOS run-time stats accounting. OFF by default so a production panel
  # pays no per-context-switch accounting cost. A diagnostic build that wants the
  # perf-overlay's per-core CPU% overrides this to "y" in its composition root AND
  # includes modules/perf-overlay.yaml. Three Kconfig options below are gated on it.
  freertos_runtime_stats: "n"

esphome:
  min_version: 2026.5.0
  # No `project:` here — ui-foundation.yaml stamps ${project_name}/${project_version}
  # (per-panel identity); a second project block in the package merge would
  # silently fight it.

esp32:
  board: esp32-p4-evboard
  # This panel ships engineering-sample P4 silicon (eco2 ROM, chip rev v1.3).
  # Without engineering_sample, ESP-IDF assumes production silicon and the
  # FreeRTOS timer-task static stack alloc fails at boot
  # (assert vApplicationGetTimerTaskMemory: pxStackBufferTemp != NULL).
  # Mirrors the known-good chrisdunnname baseline (esp32-p4-86-panel.yaml).
  engineering_sample: true
  flash_size: 32MB
  # CPU 360→400MHz: ~11% more compute for the LVGL software rasteriser + GLaDOS
  # animation math. Stacks with the -O2 build below. NOTE: engineering-sample
  # silicon (eco2, rev v1.3) — watch boot + run stability after flashing; revert
  # to 360 (drop this line) if it gets flaky.
  cpu_frequency: 400MHz
  framework:
    type: esp-idf
    components:
      - espressif/esp_hosted==2.12.1
    sdkconfig_options:
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: y
      # : SDIO RX/TX queue depth to the WiFi co-processor.
      # Default is 20 buffers. Bursts of online_image cover-art downloads
      # (8 Pick + 8 Browse covers fire together when sensor.spotify_panel_*
      # updates), combined with multi-second blocking JPEG decodes that stall
      # the consumer (lwip→socket→online_image in the main loop), let the SDIO
      # RX queue drain to empty → `sdio_rx_get_buffer sdio_drv.c:896 (*buf)`
      # asserts (illegal-instruction → SW_CPU_RESET, runtime crash-reboot).
      # Deeper RX queue rides out the decode stalls without starving. TX bumped
      # modestly to keep the TLS request side from throttling. Verify on-device
      # (panel-46t-triage-host-officepc serial) that crashes stop; the app-side
      # download-serialisation follow-up is the demand-side complement.
      CONFIG_ESP_HOSTED_SDIO_RX_Q_SIZE: "64"
      CONFIG_ESP_HOSTED_SDIO_TX_Q_SIZE: "32"
      # ── lwIP TCP throughput ──
      # The panel↔C6 esp-hosted link measured ~0.7 Mbit/s despite -55 dBm RSSI +
      # WiFi-6 + power_save NONE — it is TCP-WINDOW-bound, not PHY-bound (changing
      # the AP/band did nothing). Default ~5.7 KB window ÷ ~65 ms esp-hosted RPC RTT
      # ≈ 88 KB/s, which matches the measurement. Enlarge the receive window + recv
      # mailboxes so far more bytes are in flight per round-trip (window ÷ RTT). 64 KB
      # is the max without window-scaling. Watch int_free on-device; dial WND back to
      # 32768 if heap/stability suffers. RECVMBOX ≈ WND/MSS + 2.
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "32768"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "48"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "48"
      CONFIG_LWIP_TCP_MSS: "1440"
      # FreeRTOS run-time stats — feeds the perf-overlay's per-core CPU%
      # (modules/perf-overlay.yaml reads the idle-task run-time counters). Adds a
      # small per-context-switch accounting cost, so it is opt-in per panel via
      # ${freertos_runtime_stats} (default "n"; this panel sets "y" while the pm1.x
      # profiling campaign is active). A production panel leaves it off.
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: ${freertos_runtime_stats}
      CONFIG_FREERTOS_USE_TRACE_FACILITY: ${freertos_runtime_stats}
      CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER: ${freertos_runtime_stats}
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
      # : build at -O2 (PERF) instead of ESPHome's default -Os (SIZE). Use the
      # NATIVE key, not a raw CONFIG_..._PERF in sdkconfig_options — the latter
      # loses the Kconfig `choice` to ESPHome's own SIZE=y (verified: build stayed
      # -Os). Speeds the per-pixel rasterise + GLaDOS lerp/transform math.
      compiler_optimization: PERF

psram:
  # Baseline uses default PSRAM mode (not hex) — mode: hex contributed to the
  # boot-time PSRAM allocation failure on this engineering-sample silicon.
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

http_request:
  timeout: 30s
  watchdog_timeout: 60s

# -------------------------------------------
# Network hardware
# -------------------------------------------

# Ethernet settings
# ethernet:
#   type: IP101
#   mdc_pin: GPIO31
#   mdio_pin: GPIO52
#   clk:
#     pin: GPIO50
#     mode: CLK_EXT_IN
#   phy_addr: 1
#   power_pin: GPIO51

esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  # Place the SDIO transport buffer pool in PSRAM (11.8MB free) instead of the
  # ~240KB internal RAM. Directly relieves the esp-hosted RX-queue exhaustion that
  # asserts as `sdio_push_data_to_queue … (pkt_rxbuff)` under download load on the
  # split P4/C6 board ( boot-loop fix; esphome esp32_hosted docs + issue #10956).
  use_psram: true

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: ESP-Hosted Firmware
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# -------------------------------------------
# Bluetooth tracker — EXTRACTED to a gateable package.
# -------------------------------------------
# The BLE proxy (esp32_ble_tracker + bluetooth_proxy, via the hosted ESP32-C6)
# moved to modules/ble-proxy.yaml so a panel can OMIT it. Most panels
# include `ble_proxy: !include modules/ble-proxy.yaml`; Hallway leaves it out
# (no BLE proxy). ESPHome has no {% if %}, so the gate is package presence, not
# a substitution flag.

# -------------------------------------------
# LCD Back light and Relays
# -------------------------------------------
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO26
    frequency: 100Hz
    inverted: true
    min_power: 0.0
    max_power: 0.8  # To prevent overheating due to excessive lighting

  - id: internal_relay_1
    platform: gpio
    pin: GPIO32

  - id: internal_relay_2
    platform: gpio
    pin: GPIO46

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON

# -------------------------------------------
# Touchscreen gt911
# -------------------------------------------
i2c:
  - id: i2c_bus_a
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: i2c_bus_a
  # Wake the panel on any touch: the gt911 keeps reporting touches while the
  # backlight is off (the LVGL framebuffer is still live underneath), so a tap
  # turns the backlight back on before LVGL handles the press. Idempotent when
  # already on.
  on_touch:
    - light.turn_on: display_backlight
  # on_touch (debug):
  #   - lambda: |-
  #       ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
  # on_update:
  #   - lambda: |-
  #       for (auto touch: touches)  {
  #           if (touch.state <= 2) {
  #             ESP_LOGI("Touch points:", "id=%d x=%d, y=%d x.raw=%d, y.raw=%d", touch.id, touch.x, touch.y, touch.x_raw, touch.y_raw);
  #           }
  #       }

# -------------------------------------------
# Display mipi_dsi
# -------------------------------------------
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-P4-86-PANEL

# Special LVGL settings required for this display
lvgl:
  rotation: ${rotation | default("0")}
  byte_order: little_endian

# -------------------------------------------
# Audio
# -------------------------------------------
switch:
  - platform: gpio
    id: audio_amplifier
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO53  # BSP_POWER_AMP_IO
    restore_mode: RESTORE_DEFAULT_ON

i2s_audio:
  - id: i2s_audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: my_dac
    i2c_id: i2c_bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000

audio_adc:
  - platform: es7210
    id: my_adc
    i2c_id: i2c_bus_a
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: my_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    channel: stereo
    # on_data:
    #   - logger.log:
    #       format: "Microphone data received: %d bytes"
    #       args: [x.size()]

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: my_dac
    dac_type: external
    channel: mono
    # buffer_duration is NOT the lever for the "Event/record queues desynced"
    # glitch — that's mic/speaker shared-i2s-bus contention, fixed by serialising
    # mic-release before speaker-start in assist.yaml. The
    # 100ms->500ms bump tried during the wake-word session did nothing for the
    # desync, so keep the stock 100ms rather than carry a no-op change.
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: my_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
