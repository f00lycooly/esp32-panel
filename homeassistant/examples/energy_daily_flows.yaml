# energy_daily_flows.yaml — HA package: measured daily energy-flow splits for
# the panel's "Today" Sankey (the en_df_* substitutions in user-config.yaml).
#
# Register in configuration.yaml:
#   homeassistant:
#     packages:
#       panel_energy_flows: !include energy_daily_flows.yaml
#
# Pipeline: instantaneous flow-path power (template sensors, W) → Riemann
# integration (kWh) → daily utility_meter (resets at midnight) →
# sensor.daily_flow_<path> consumed by the panel.
#
# Allocation is the standard self-consumption split, INSTANTANEOUS (all inputs
# simultaneous, so it is exact): PV serves load first, then charges the
# battery, then exports; load shortfall is met by battery discharge, then grid
# import. EV/HP are sub-loads drawing the home's instantaneous source blend.
#
# CHANGE: the five input sensors, assumed to report kW (hence the ×1000):
#   sensor.pv_power          PV generation
#   sensor.house_power       total house consumption (incl. EV + HP)
#   sensor.battery_power     +charge / -discharge
#   sensor.ev_charger_power  EV charger draw (0 if you have none)
#   sensor.heat_pump_power   heat pump draw   (0 if you have none)
# If yours report W, drop the "* 1000" factors. No EV or HP? Keep the
# templates — they render 0 and the panel hides empty ribbons.

template:
  - sensor:
      - name: "Flow PV to Home"
        unique_id: flow_pv_to_home
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set pv_load = [pv, load]|min %}
          {{ (pv_load * 1000)|round(1) }}

      - name: "Flow PV to Battery"
        unique_id: flow_pv_to_battery
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set charge = [b, 0]|max %}
          {% set pv_load = [pv, load]|min %}
          {% set pv_bat = [pv - pv_load, charge]|min %}
          {{ ([pv_bat, 0]|max * 1000)|round(1) }}

      - name: "Flow PV to Grid"
        unique_id: flow_pv_to_grid
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set charge = [b, 0]|max %}
          {% set pv_load = [pv, load]|min %}
          {% set pv_bat = [pv - pv_load, charge]|min %}
          {% set pv_grid = pv - pv_load - pv_bat %}
          {{ ([pv_grid, 0]|max * 1000)|round(1) }}

      - name: "Flow Battery to Home"
        unique_id: flow_battery_to_home
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {{ ([bat_load, 0]|max * 1000)|round(1) }}

      - name: "Flow Battery to Grid"
        unique_id: flow_battery_to_grid
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {% set bat_grid = discharge - bat_load %}
          {{ ([bat_grid, 0]|max * 1000)|round(1) }}

      - name: "Flow Grid to Battery"
        unique_id: flow_grid_to_battery
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set charge = [b, 0]|max %}
          {% set pv_load = [pv, load]|min %}
          {% set pv_bat = [pv - pv_load, charge]|min %}
          {% set grid_bat = charge - pv_bat %}
          {{ ([grid_bat, 0]|max * 1000)|round(1) }}

      - name: "Flow Grid to Home"
        unique_id: flow_grid_to_home
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {% set grid_load = load - pv_load - bat_load %}
          {{ ([grid_load, 0]|max * 1000)|round(1) }}

      # --- EV + Heat-Pump source attribution -----------------------
      # The EV charger and heat pump are sub-loads of house consumption. Each draws the home's INSTANTANEOUS source
      # blend, so flow_X_to_{ev,hp} = sink_power * (flow_X_to_home / load). The
      # existing 7 flow_*_to_home templates are re-interpreted as "all load incl
      # EV+HP"; the panel derives Home-rest by subtracting these from those.
      #   frac_X = flow_X_to_home (W) / (load * 1000)          [guard load==0 -> 0]
      #   sinks  = ev + hp, clamped to <= load (scaled down proportionally if over)
      #   output = clamped_sink (kW) * 1000 * frac_X            -> W
      # Each template re-derives flow_X_to_home locally (same maths as above) so it
      # never depends on the other template's update order / availability.

      - name: "Flow PV to EV"
        unique_id: flow_pv_to_ev
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set ev = [states('sensor.ev_charger_power')|float(0),0]|max %}
          {% set hp = [states('sensor.heat_pump_power')|float(0),0]|max %}
          {% set sinks = ev + hp %}
          {% set scale = ([load, sinks]|min / sinks) if sinks > 0 else 0 %}
          {% set ev_c = ev * scale %}
          {% set pv_load = [pv, load]|min %}
          {% set frac = (pv_load / load) if load > 0 else 0 %}
          {{ (ev_c * 1000 * frac)|round(1) }}

      - name: "Flow Battery to EV"
        unique_id: flow_battery_to_ev
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set ev = [states('sensor.ev_charger_power')|float(0),0]|max %}
          {% set hp = [states('sensor.heat_pump_power')|float(0),0]|max %}
          {% set sinks = ev + hp %}
          {% set scale = ([load, sinks]|min / sinks) if sinks > 0 else 0 %}
          {% set ev_c = ev * scale %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {% set frac = (bat_load / load) if load > 0 else 0 %}
          {{ (ev_c * 1000 * frac)|round(1) }}

      - name: "Flow Grid to EV"
        unique_id: flow_grid_to_ev
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set ev = [states('sensor.ev_charger_power')|float(0),0]|max %}
          {% set hp = [states('sensor.heat_pump_power')|float(0),0]|max %}
          {% set sinks = ev + hp %}
          {% set scale = ([load, sinks]|min / sinks) if sinks > 0 else 0 %}
          {% set ev_c = ev * scale %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {% set grid_load = load - pv_load - bat_load %}
          {% set frac = ([grid_load, 0]|max / load) if load > 0 else 0 %}
          {{ (ev_c * 1000 * frac)|round(1) }}

      - name: "Flow PV to HP"
        unique_id: flow_pv_to_hp
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set ev = [states('sensor.ev_charger_power')|float(0),0]|max %}
          {% set hp = [states('sensor.heat_pump_power')|float(0),0]|max %}
          {% set sinks = ev + hp %}
          {% set scale = ([load, sinks]|min / sinks) if sinks > 0 else 0 %}
          {% set hp_c = hp * scale %}
          {% set pv_load = [pv, load]|min %}
          {% set frac = (pv_load / load) if load > 0 else 0 %}
          {{ (hp_c * 1000 * frac)|round(1) }}

      - name: "Flow Battery to HP"
        unique_id: flow_battery_to_hp
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set ev = [states('sensor.ev_charger_power')|float(0),0]|max %}
          {% set hp = [states('sensor.heat_pump_power')|float(0),0]|max %}
          {% set sinks = ev + hp %}
          {% set scale = ([load, sinks]|min / sinks) if sinks > 0 else 0 %}
          {% set hp_c = hp * scale %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {% set frac = (bat_load / load) if load > 0 else 0 %}
          {{ (hp_c * 1000 * frac)|round(1) }}

      - name: "Flow Grid to HP"
        unique_id: flow_grid_to_hp
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv = [states('sensor.pv_power')|float(0),0]|max %}
          {% set load = [states('sensor.house_power')|float(0),0]|max %}
          {% set b = states('sensor.battery_power')|float(0) %}
          {% set discharge = [0 - b, 0]|max %}
          {% set ev = [states('sensor.ev_charger_power')|float(0),0]|max %}
          {% set hp = [states('sensor.heat_pump_power')|float(0),0]|max %}
          {% set sinks = ev + hp %}
          {% set scale = ([load, sinks]|min / sinks) if sinks > 0 else 0 %}
          {% set hp_c = hp * scale %}
          {% set pv_load = [pv, load]|min %}
          {% set bat_load = [discharge, load - pv_load]|min %}
          {% set grid_load = load - pv_load - bat_load %}
          {% set frac = ([grid_load, 0]|max / load) if load > 0 else 0 %}
          {{ (hp_c * 1000 * frac)|round(1) }}

# Riemann-sum integrations: flow power (W) → cumulative kWh.
sensor:
  - platform: integration
    source: sensor.flow_pv_to_home
    name: flow_pv_to_home_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_pv_to_battery
    name: flow_pv_to_battery_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_pv_to_grid
    name: flow_pv_to_grid_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_battery_to_home
    name: flow_battery_to_home_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_battery_to_grid
    name: flow_battery_to_grid_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_grid_to_home
    name: flow_grid_to_home_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_grid_to_battery
    name: flow_grid_to_battery_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_pv_to_ev
    name: flow_pv_to_ev_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_battery_to_ev
    name: flow_battery_to_ev_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_grid_to_ev
    name: flow_grid_to_ev_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_pv_to_hp
    name: flow_pv_to_hp_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_battery_to_hp
    name: flow_battery_to_hp_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.flow_grid_to_hp
    name: flow_grid_to_hp_energy
    unit_prefix: k
    unit_time: h
    method: left

# Daily meters (midnight reset) — the entities the panel binds.
utility_meter:
  daily_flow_pv_to_home:
    source: sensor.flow_pv_to_home_energy
    cycle: daily

  daily_flow_pv_to_battery:
    source: sensor.flow_pv_to_battery_energy
    cycle: daily

  daily_flow_pv_to_grid:
    source: sensor.flow_pv_to_grid_energy
    cycle: daily

  daily_flow_battery_to_home:
    source: sensor.flow_battery_to_home_energy
    cycle: daily

  daily_flow_battery_to_grid:
    source: sensor.flow_battery_to_grid_energy
    cycle: daily

  daily_flow_grid_to_home:
    source: sensor.flow_grid_to_home_energy
    cycle: daily

  daily_flow_grid_to_battery:
    source: sensor.flow_grid_to_battery_energy
    cycle: daily

  daily_flow_pv_to_ev:
    source: sensor.flow_pv_to_ev_energy
    cycle: daily

  daily_flow_battery_to_ev:
    source: sensor.flow_battery_to_ev_energy
    cycle: daily

  daily_flow_grid_to_ev:
    source: sensor.flow_grid_to_ev_energy
    cycle: daily

  daily_flow_pv_to_hp:
    source: sensor.flow_pv_to_hp_energy
    cycle: daily

  daily_flow_battery_to_hp:
    source: sensor.flow_battery_to_hp_energy
    cycle: daily

  daily_flow_grid_to_hp:
    source: sensor.flow_grid_to_hp_energy
    cycle: daily
