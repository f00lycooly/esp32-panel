# energy_normalised.yaml — HA package: normalised energy sensors matching the
# shape the panel's Energy pages expect (the en_* / battery_* substitutions in
# user-config.yaml). Register in configuration.yaml:
#   homeassistant:
#     packages:
#       panel_energy: !include energy_normalised.yaml
#
# The panel expects (all in kW, all ≥ 0 unless noted):
#   sensor.pv_power            PV generation
#   sensor.house_power         total house consumption (incl. EV + heat pump)
#   sensor.grid_import_power   grid import  (≥ 0; 0 while exporting)
#   sensor.grid_export_power   grid export  (≥ 0; 0 while importing)
#   sensor.battery_power       +charge / -discharge (SIGNED)
#   sensor.battery_soc         %
#   sensor.ev_charger_power    EV charger draw (0 / omit if none)
#   sensor.heat_pump_power     heat pump draw  (0 / omit if none)
#
# If your inverter/charger integration already exposes entities in this shape,
# skip this file and point the user-config en_* keys straight at them. The
# templates below show the common normalisations; # CHANGE every source entity
# to your integration's ids and check its units (these examples assume the
# sources are already kW — add "/ 1000" if yours report W) and sign
# conventions (some integrations sign battery power the other way round).

template:
  - sensor:
      # Split a single signed grid sensor (+export / -import here — flip the
      # signs if your integration does the opposite) into the two ≥0 sensors
      # the Sankey binds.
      - name: "Grid Import Power"
        unique_id: grid_import_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ [0 - states('sensor.my_inverter_grid_power') | float(0), 0] | max }}   # CHANGE

      - name: "Grid Export Power"
        unique_id: grid_export_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ [states('sensor.my_inverter_grid_power') | float(0), 0] | max }}       # CHANGE

      # Plain renames/pass-throughs — point the panel at ONE stable name even
      # if you later swap inverter integrations.
      - name: "PV Power"
        unique_id: pv_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.my_inverter_pv_power') | float(0) }}"             # CHANGE

      - name: "House Power"
        unique_id: house_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.my_inverter_consumed_power') | float(0) }}"       # CHANGE

      - name: "Battery Power"
        unique_id: battery_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        # SIGNED: +charge / -discharge (flip with "0 -" if needed).
        state: "{{ states('sensor.my_inverter_battery_power') | float(0) }}"        # CHANGE

      - name: "Battery SOC"
        unique_id: battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ states('sensor.my_inverter_battery_soc') | float(0) }}"          # CHANGE

      - name: "EV Charger Power"
        unique_id: ev_charger_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        # No EV charger? Leave this rendering 0 — the panel hides the node.
        state: "{{ states('sensor.my_ev_charger_power') | float(0) }}"              # CHANGE

      - name: "Heat Pump Power"
        unique_id: heat_pump_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        # No heat pump? Leave this rendering 0 — the panel hides the node.
        state: "{{ states('sensor.my_heat_pump_power') | float(0) }}"               # CHANGE
