# weather_forecast.yaml — HA package: processed Today/Tomorrow forecast wrapper
# consumed by the panel screensaver (weather_forecast_entity in
# user-config.yaml → sensor.panel_weather_forecast).
# Register in configuration.yaml:
#   homeassistant:
#     packages:
#       panel_weather: !include weather_forecast.yaml
# CHANGE: weather.forecast_home → your weather entity (5 occurrences).

template:
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/30"
      - platform: state
        entity_id: weather.forecast_home
      - platform: event
        event_type: panel_weather_refresh
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: fc
    sensor:
      - name: "Panel Weather Forecast"
        unique_id: panel_weather_forecast
        icon: mdi:weather-partly-cloudy
        # State = current condition (handy for debugging in Developer Tools).
        state: "{{ states('weather.forecast_home') }}"
        attributes:
          # Single-line expressions only — multi-line Jinja would inject whitespace
          # into the value and break the panel's condition match.
          today: >-
            {{ (fc['weather.forecast_home'].forecast[0].condition ~ '|' ~ (fc['weather.forecast_home'].forecast[0].temperature | round(0) | int) ~ '|' ~ (fc['weather.forecast_home'].forecast[0].templow | default(fc['weather.forecast_home'].forecast[0].temperature) | round(0) | int)) if fc is defined and 'weather.forecast_home' in fc and (fc['weather.forecast_home'].forecast | count) > 0 else '' }}
          tomorrow: >-
            {{ (fc['weather.forecast_home'].forecast[1].condition ~ '|' ~ (fc['weather.forecast_home'].forecast[1].temperature | round(0) | int) ~ '|' ~ (fc['weather.forecast_home'].forecast[1].templow | default(fc['weather.forecast_home'].forecast[1].temperature) | round(0) | int)) if fc is defined and 'weather.forecast_home' in fc and (fc['weather.forecast_home'].forecast | count) > 1 else '' }}
